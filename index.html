<meta charset="utf-8">
<title>Uso Inmobiliario — Catálogo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- GitHub Pages sirve archivos estáticos sin poder configurar headers HTTP reales, así que
     CSP/Referrer-Policy van acá por <meta> — es lo único que un sitio 100% estático puede
     controlar por su cuenta. X-Frame-Options/HSTS/X-Content-Type-Options SÍ requieren un
     header HTTP real (no existen como <meta>): ver DEPLOYMENT.md, quedan documentados como
     pendientes de una capa como Cloudflare delante de GitHub Pages.
     script-src/style-src necesitan 'unsafe-inline' porque todo el sitio es un único HTML sin
     build step (por diseño, ver AUDITORIA.md) — no hay paso de compilación donde inyectar un
     nonce por request. Esto NO cubre los mismos bugs que ya se corrigieron aparte (escapes de
     atributo, esquemas javascript:/data: en href) — sigue haciendo falta escapar/validar cada
     dato en el punto donde se usa; lo que sí bloquea es cargar un script/stylesheet desde
     cualquier origen fuera de esta lista, y limita a dónde puede conectarse/enviar datos la
     página (connect-src) y qué puede embeberse en un <iframe> (frame-src). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net https://streetviewpixels-pa.googleapis.com; connect-src 'self' https://usoinmobiliario-whatsapp-bot.onrender.com https://*.firebaseio.com wss://*.firebaseio.com https://www.googleapis.com; frame-src https://www.google.com; object-src 'none'; base-uri 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,460;0,9..144,560;1,9..144,460&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<style>
  :root{
    --ink:#20241f; --paper:#f5f0e6; --paper-2:#efe7d8;
    --forest:#33513f; --forest-dk:#22362a; --clay:#b6603c;
    --sand:#e4d8c3; --ochre:#9c7b3f; --line: rgba(32,36,31,0.14);
    --card: #faf6ec; --shadow: 0 18px 40px -22px rgba(32,36,31,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eee9db; --paper:#181c17; --paper-2:#1f251d;
      --forest:#7fa88d; --forest-dk:#a6c7b1; --clay:#d98a63;
      --sand:#2a2c22; --ochre:#cbab6c; --line: rgba(238,233,219,0.16);
      --card:#20241d; --shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --ink:#eee9db; --paper:#181c17; --paper-2:#1f251d;
    --forest:#7fa88d; --forest-dk:#a6c7b1; --clay:#d98a63;
    --sand:#2a2c22; --ochre:#cbab6c; --line: rgba(238,233,219,0.16);
    --card:#20241d; --shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html{background:var(--paper);}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Karla',ui-sans-serif,system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Fraunces',ui-serif,Georgia,serif;font-weight:560;letter-spacing:-0.01em;text-wrap:balance;margin:0;color:var(--ink);}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding-inline:28px;}
  .eyebrow{font-size:12.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--clay);display:flex;align-items:center;gap:10px;}
  .eyebrow::before{content:"";width:22px;height:1.5px;background:var(--clay);display:inline-block;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:14.5px;text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease;white-space:nowrap;font-family:inherit;}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;}
  .btn-primary{background:var(--forest);color:#f5f0e6;}
  :root[data-theme="dark"] .btn-primary, :root:not([data-theme="light"]) .btn-primary{color:#12140f;}
  :root[data-theme="light"] .btn-primary{color:#f5f0e6;}
  .btn-primary:hover{background:var(--forest-dk);}
  .btn-ghost{border-color:var(--line);color:var(--ink);background:transparent;}
  .btn-ghost:hover{border-color:var(--clay);color:var(--clay);}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .btn-icon{padding:10px;line-height:0;}
  .btn-icon svg{width:20px;height:20px;display:block;}
  .btn:focus-visible, button:focus-visible, a:focus-visible{outline:2px solid var(--clay);outline-offset:3px;}

  .topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
  .topbar-left{display:flex;align-items:center;gap:14px;}
  .logo{font-family:'Fraunces',serif;font-weight:560;font-size:21px;letter-spacing:-0.01em;display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);}
  .logo em{font-style:normal;color:var(--clay);}
  .nav-links{display:flex;gap:26px;font-size:14.5px;font-weight:600;list-style:none;margin:0;padding:0;}
  .nav-links a{text-decoration:none;opacity:0.82;border-bottom:2px solid transparent;padding-bottom:3px;}
  .nav-links a:hover, .nav-links a.is-active{opacity:1;border-color:var(--clay);}
  .topbar-actions{display:flex;align-items:center;gap:14px;}
  .lang-toggle{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;font-weight:700;font-size:12.5px;}
  .lang-toggle button{border:none;background:transparent;color:var(--ink);opacity:0.55;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;font-weight:700;font-size:12.5px;letter-spacing:0.03em;}
  .lang-toggle button.active{background:var(--forest);color:#f5f0e6;opacity:1;}
  :root[data-theme="dark"] .lang-toggle button.active, :root:not([data-theme="light"]) .lang-toggle button.active{color:#12140f;}
  :root[data-theme="light"] .lang-toggle button.active{color:#f5f0e6;}
  .nav-toggle{display:none;background:none;border:1.5px solid var(--line);border-radius:10px;color:var(--ink);cursor:pointer;padding:8px;align-items:center;justify-content:center;}
  .nav-toggle svg{width:20px;height:20px;}
  .mobile-nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:var(--shadow);}
  .mobile-nav.open{display:block;}
  .mobile-nav ul{list-style:none;margin:0;padding:8px 0;}
  .mobile-nav a{display:block;padding:13px 22px;text-decoration:none;color:inherit;font-weight:600;font-size:15px;opacity:0.85;}
  .mobile-nav a.is-active{opacity:1;color:var(--clay);}
  @media (max-width: 860px){
    .nav-links{display:none;}
    .nav-toggle{display:inline-flex;}
  }

  .demo-note{background:var(--forest-dk);color:#f5f0e6;}
  :root[data-theme="dark"] .demo-note, :root:not([data-theme="light"]) .demo-note{color:#12140f;}
  :root[data-theme="light"] .demo-note{color:#f5f0e6;}
  .demo-note .wrap{display:flex;gap:10px;align-items:center;justify-content:center;padding:9px 28px;font-size:13px;font-weight:600;text-align:center;flex-wrap:wrap;}
  .demo-note strong{color:var(--clay);}

  .crumbs{padding:20px 0 0;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;opacity:0.75;}
  .crumbs a{text-decoration:none;opacity:0.75;}
  .crumbs a:hover{opacity:1;color:var(--clay);}
  .crumbs .sep{opacity:0.4;}
  .crumbs .current{color:var(--clay);opacity:1;}

  .hero{padding:44px 0 56px;}
  .hero-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:56px;align-items:center;}
  @media (max-width:920px){ .hero-grid{grid-template-columns:1fr;gap:36px;} .hero{padding:32px 0 40px;} }
  .hero h1{font-size:clamp(2.3rem, 4.4vw, 3.5rem);line-height:1.04;margin:16px 0 20px;}
  .hero h1 i{font-style:italic;color:var(--forest);}
  :root:not([data-theme="light"]) .hero h1 i{color:var(--forest-dk);}
  .hero p.lead{font-size:17.5px;max-width:46ch;opacity:0.85;margin-bottom:28px;}
  .hero-ctas{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:34px;}
  .stat-row{display:flex;gap:34px;flex-wrap:wrap;}
  .stat b{font-family:'Fraunces',serif;font-size:26px;display:block;color:var(--forest);font-weight:560;}
  :root[data-theme="dark"] .stat b, :root:not([data-theme="light"]) .stat b{color:var(--forest-dk);}
  .stat span{font-size:12.5px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.65;font-weight:700;}
  .hero-media{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/5;background:#1c231d;}
  .hero-media img{width:100%;height:100%;object-fit:cover;}
  .hero-pano{width:100%;height:100%;cursor:grab;touch-action:none;}
  .hero-pano.dragging{cursor:grabbing;}
  .hero-pano canvas{display:block;width:100% !important;height:100% !important;}
  .hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(200deg, rgba(32,36,31,0) 40%, rgba(32,36,31,0.55) 100%);pointer-events:none;}
  .hero-badge{position:absolute;left:18px;bottom:18px;z-index:2;background:rgba(245,240,230,0.94);color:#20241f;padding:11px 16px;border-radius:14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:9px;box-shadow:0 8px 20px -8px rgba(0,0,0,0.4);}
  .hero-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--clay);flex:none;}

  .features{padding:8px 0 60px;}
  .feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;}
  @media (max-width:1024px){ .feature-grid{grid-template-columns:1fr 1fr;} .feature-grid .feature:last-child{grid-column:1/-1;} }
  @media (max-width:640px){ .feature-grid{grid-template-columns:1fr;} .feature-grid .feature:last-child{grid-column:auto;} }
  .feature{background:var(--card);padding:30px 28px;}
  .feature .num{font-family:'Fraunces',serif;font-size:14px;color:var(--clay);font-weight:600;display:block;margin-bottom:14px;}
  .feature h3{font-size:19px;margin-bottom:8px;}
  .feature p{margin:0;font-size:14.5px;opacity:0.78;}

  .units-section{padding:20px 0 64px;border-top:1px solid var(--line);}
  .section-head{max-width:60ch;margin-bottom:34px;}
  .section-head h2{font-size:clamp(1.9rem,3.2vw,2.6rem);margin-top:14px;}
  .section-head p{opacity:0.78;margin-top:12px;font-size:15.5px;}

  /* type tabs (segmented control) */
  .type-tabs{display:inline-flex;gap:4px;padding:5px;border:1.5px solid var(--line);border-radius:999px;margin-bottom:28px;background:var(--card);}
  .type-tab{border:none;background:transparent;font-family:inherit;font-weight:700;font-size:14px;padding:11px 22px;border-radius:999px;cursor:pointer;color:var(--ink);opacity:0.6;display:flex;align-items:center;gap:8px;transition:background .18s, opacity .18s, color .18s;}
  .type-tab .count{font-size:11.5px;font-weight:700;background:var(--paper-2);padding:2px 8px;border-radius:999px;opacity:0.8;font-variant-numeric:tabular-nums;}
  .type-tab.active{background:var(--forest);color:#f5f0e6;opacity:1;}
  :root[data-theme="dark"] .type-tab.active, :root:not([data-theme="light"]) .type-tab.active{color:#12140f;}
  :root[data-theme="light"] .type-tab.active{color:#f5f0e6;}
  .type-tab.active .count{background:rgba(245,240,230,0.22);color:inherit;}
  .type-summary{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .type-summary h3{font-size:22px;}
  .type-summary .type-blurb{font-size:14.5px;opacity:0.72;max-width:56ch;}
  .type-summary .type-price{font-family:'Fraunces',serif;font-weight:560;font-size:19px;color:var(--forest);white-space:nowrap;}
  :root[data-theme="dark"] .type-summary .type-price, :root:not([data-theme="light"]) .type-summary .type-price{color:var(--forest-dk);}

  /* status legend — ahora son filtros clicables, no solo texto */
  .status-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);}
  .sl-filter{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;font-family:inherit;background:none;border:1.5px solid transparent;border-radius:8px;padding:7px 10px;cursor:pointer;color:inherit;}
  .sl-filter:hover{border-color:var(--line);}
  .sl-filter.active{background:var(--paper-2);border-color:var(--line);}
  .sl-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .sl-dot.sl-dot-all{background:currentColor;opacity:0.5;}
  .sl-count{font-variant-numeric:tabular-nums;opacity:0.6;font-weight:700;}

  /* availability grid + cards */
  .unit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media (max-width:1024px){ .unit-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:640px){ .unit-grid{grid-template-columns:1fr;} }
  .ua-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);text-decoration:none;display:flex;flex-direction:column;transition:transform .15s ease;position:relative;}
  .ua-card:hover{transform:translateY(-3px);}
  .ua-card.st-en-uso{opacity:0.7;}
  .ua-card.st-reservado{opacity:1;}
  .ua-code .star{color:var(--ochre);margin-right:3px;}
  .ua-thumb{aspect-ratio:16/10;position:relative;overflow:hidden;background:var(--sand);}
  .ua-thumb img{width:100%;height:100%;object-fit:cover;}
  .ua-badge{position:absolute;left:12px;top:12px;font-size:11px;font-weight:700;letter-spacing:0.03em;padding:6px 11px;border-radius:999px;display:flex;align-items:center;gap:6px;}
  .ua-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
  .ua-badge.st-disponible{background:rgba(51,81,63,0.92);color:#eef4ee;}
  .ua-badge.st-en-uso{background:rgba(156,123,63,0.94);color:#fff8ea;}
  .ua-badge.st-reservado{background:rgba(24,28,23,0.62);color:#f0ece2;}
  .ua-360{position:absolute;right:12px;top:12px;background:rgba(182,96,60,0.92);color:#f8f2ea;font-size:10px;font-weight:700;padding:6px 10px;border-radius:999px;letter-spacing:0.03em;}
  .ua-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .ua-top{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums;}
  .ua-code{font-weight:700;font-size:15px;}
  .ua-area{font-size:12.5px;opacity:0.6;font-weight:600;}
  .ua-feature{font-size:12px;opacity:0.65;margin:0;}
  .ua-price{font-family:'Fraunces',serif;font-weight:560;font-size:19px;color:var(--forest);margin:2px 0 0;}
  :root[data-theme="dark"] .ua-price, :root:not([data-theme="light"]) .ua-price{color:var(--forest-dk);}
  .ua-price small{font-family:'Karla',sans-serif;font-size:11px;font-weight:700;opacity:0.55;text-transform:uppercase;letter-spacing:0.04em;}
  .ua-cta{margin:auto 0 0;font-size:12.5px;font-weight:700;color:var(--clay);display:flex;align-items:center;gap:5px;}
  .catalog-note{font-size:12.5px;opacity:0.55;margin-top:20px;}

  /* real rates table (unit page) */
  .rates-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;}
  table.rates-table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:480px;}
  table.rates-table th, table.rates-table td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);}
  table.rates-table th:first-child, table.rates-table td:first-child{text-align:left;font-weight:700;}
  table.rates-table thead th{background:var(--paper-2);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;font-weight:700;opacity:0.7;}
  table.rates-table tbody tr:last-child td{border-bottom:none;}
  table.rates-table td.hl{font-weight:700;color:var(--forest);}
  :root[data-theme="dark"] table.rates-table td.hl, :root:not([data-theme="light"]) table.rates-table td.hl{color:var(--forest-dk);}
  .spec-mini{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .spec-chip{background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;}
  .unit-status-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;margin-bottom:10px;}
  .unit-status-badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
  .unit-status-badge.st-disponible{background:rgba(51,81,63,0.14);color:var(--forest);}
  .unit-status-badge.st-en-uso{background:rgba(156,123,63,0.16);color:var(--ochre);}
  .unit-status-badge.st-reservado{background:rgba(24,28,23,0.1);color:var(--ink);opacity:0.8;}
  :root[data-theme="dark"] .unit-status-badge.st-disponible, :root:not([data-theme="light"]) .unit-status-badge.st-disponible{color:var(--forest-dk);}

  .location{padding:60px 0;border-top:1px solid var(--line);background:var(--paper-2);}
  .loc-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;}
  @media (max-width:860px){ .loc-grid{grid-template-columns:1fr;} }
  .loc-list{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;}
  .loc-list li{font-size:14.5px;}
  .loc-list b{display:block;font-family:'Fraunces',serif;font-size:21px;color:var(--forest);font-weight:560;}
  :root[data-theme="dark"] .loc-list b, :root:not([data-theme="light"]) .loc-list b{color:var(--forest-dk);}
  .loc-visual{border-radius:20px;border:1px solid var(--line);padding:26px;background:var(--card);box-shadow:var(--shadow);}
  .loc-visual .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--clay);border:1px solid currentColor;padding:5px 11px;border-radius:999px;margin-bottom:14px;}

  .cta-band{position:relative;padding:70px 0;color:#f5f0e6;text-align:center;overflow:hidden;isolation:isolate;}
  .cta-band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:saturate(0.7);}
  .cta-band::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(24,28,23,0.82), rgba(24,28,23,0.9));z-index:-1;}
  .cta-band h2{color:#f8f4ea;font-size:clamp(1.8rem,3.4vw,2.6rem);max-width:22ch;margin:0 auto 16px;}
  .cta-band p{opacity:0.85;max-width:52ch;margin:0 auto 30px;font-size:16px;}
  .cta-band .hero-ctas{justify-content:center;margin-bottom:0;}
  .cta-band .btn-ghost{border-color:rgba(245,240,230,0.4);color:#f5f0e6;}
  .cta-band .btn-ghost:hover{border-color:var(--clay);color:var(--clay);}

  .unit-hero{padding:26px 0 20px;}
  .unit-hero-top{display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:end;margin-bottom:30px;}
  @media (max-width:820px){ .unit-hero-top{grid-template-columns:1fr;gap:18px;} }
  .unit-hero-top h1{font-size:clamp(1.9rem,3.6vw,2.8rem);margin-top:12px;}
  .unit-code{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;letter-spacing:0.06em;color:var(--ochre);}
  .unit-hero-top .blurb{opacity:0.78;margin-top:10px;max-width:52ch;font-size:15.5px;}
  .spec-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;}
  .spec-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14.5px;padding-bottom:12px;border-bottom:1px solid var(--line);}
  .spec-row:last-of-type{border-bottom:none;padding-bottom:0;}
  .spec-row .k{opacity:0.65;font-weight:600;}
  .spec-row .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
  .spec-price{font-family:'Fraunces',serif;font-size:28px;color:var(--forest);font-weight:560;}
  :root[data-theme="dark"] .spec-price, :root:not([data-theme="light"]) .spec-price{color:var(--forest-dk);}
  .spec-price small{font-family:'Karla',sans-serif;font-size:12.5px;font-weight:700;opacity:0.6;display:block;text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}

  .unit-amenities{padding:6px 0 20px;}
  .amenities{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:11px 26px;}
  @media (max-width:640px){ .amenities{grid-template-columns:1fr;} }
  .amenities li{display:flex;gap:10px;font-size:14.5px;align-items:flex-start;}
  .amenities li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--forest);margin-top:8px;flex:none;}
  :root[data-theme="dark"] .amenities li::before, :root:not([data-theme="light"]) .amenities li::before{background:var(--forest-dk);}
  .amenities-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;}
  .amenities-title{font-size:13px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;opacity:0.6;margin-bottom:14px;}
  .real-desc{margin:18px 0 0;padding:18px 22px;border-left:3px solid var(--clay);background:var(--paper-2);border-radius:0 12px 12px 0;font-family:'Fraunces',serif;font-style:italic;font-size:15px;line-height:1.6;color:var(--ink);}
  .real-desc-tag{display:block;font-family:'Karla',sans-serif;font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--clay);margin-bottom:8px;}

  /* ---------- 360 tour section ---------- */
  .tour-section{padding:14px 0 64px;}
  .tour-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:28px;align-items:start;}
  .tour-grid > *{min-width:0;}
  @media (max-width:960px){ .tour-grid{grid-template-columns:1fr;} }
  .viewer-wrap{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/9.2;background:#14140f;box-shadow:var(--shadow);cursor:grab;touch-action:none;}
  .viewer-wrap.dragging{cursor:grabbing;}
  .viewer-wrap canvas{display:block;width:100% !important;height:100% !important;}
  .viewer-hint{position:absolute;top:16px;left:16px;z-index:3;background:rgba(24,28,23,0.62);color:#f5f0e6;font-size:12px;font-weight:700;padding:8px 13px;border-radius:999px;display:flex;align-items:center;gap:7px;letter-spacing:0.01em;backdrop-filter:blur(4px);pointer-events:none;}
  .viewer-hint svg{width:14px;height:14px;flex:none;}
  .viewer-badge{position:absolute;top:16px;right:16px;z-index:3;background:rgba(182,96,60,0.92);color:#f8f2ea;font-size:11px;font-weight:700;padding:7px 12px;border-radius:999px;letter-spacing:0.04em;pointer-events:none;}
  .viewer-roomlabel{position:absolute;left:16px;bottom:16px;z-index:3;background:rgba(24,28,23,0.68);color:#f5f0e6;font-size:13px;font-weight:700;padding:9px 15px;border-radius:10px;backdrop-filter:blur(4px);pointer-events:none;}

  .gallery-nav{display:flex;align-items:center;gap:10px;margin-top:18px;}
  .gallery-arrow{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s, color .15s, transform .1s, opacity .15s;padding:0;}
  .gallery-arrow svg{width:17px;height:17px;flex:none;}
  .gallery-arrow:hover:not(:disabled){border-color:var(--clay);color:var(--clay);}
  .gallery-arrow:active:not(:disabled){transform:scale(0.9);}
  .gallery-arrow:disabled{opacity:0.3;cursor:not-allowed;}
  .gallery-viewport{flex:1;min-width:0;overflow:hidden;}
  .gallery-track{display:flex;gap:12px;transition:transform .42s cubic-bezier(.22,.9,.32,1);will-change:transform;padding:2px 2px 6px;}
  .gallery-dots{display:flex;justify-content:center;gap:7px;margin-top:14px;}
  .gallery-dot{width:7px;height:7px;padding:0;border-radius:50%;border:none;background:var(--line);cursor:pointer;transition:background .2s, transform .2s;}
  .gallery-dot:hover{background:var(--ochre);}
  .gallery-dot.active{background:var(--clay);transform:scale(1.35);}
  .thumb-item{flex:none;width:148px;cursor:pointer;border-radius:12px;overflow:hidden;border:2px solid transparent;background:var(--card);transition:border-color .15s, transform .15s;text-align:left;padding:0;font-family:inherit;}
  .thumb-item:hover{transform:translateY(-2px);}
  .thumb-item.active{border-color:var(--clay);}
  .thumb-item .th-img{aspect-ratio:16/9;overflow:hidden;position:relative;background:var(--sand);}
  .thumb-item .th-img img{width:100%;height:100%;object-fit:cover;}
  .thumb-item .th-img .th-badge{position:absolute;right:6px;top:6px;background:rgba(24,28,23,0.65);color:#fff;font-size:8.5px;font-weight:700;padding:3px 6px;border-radius:999px;letter-spacing:0.03em;}
  .thumb-item .th-label{padding:9px 10px 10px;}
  .thumb-item .th-tag{font-size:9.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--clay);font-weight:700;display:block;margin-bottom:2px;}
  .thumb-item .th-name{font-size:12.5px;font-weight:700;line-height:1.25;}

  .room-info-area{font-size:13px;font-weight:700;opacity:0.65;text-transform:uppercase;letter-spacing:0.06em;}
  .room-info-blurb{font-size:15px;opacity:0.85;margin:8px 0 16px;}
  .feature-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .feature-list li{display:flex;gap:10px;font-size:14.5px;align-items:flex-start;}
  .feature-list li::before{content:"✓";color:var(--forest);font-weight:700;flex:none;}
  :root[data-theme="dark"] .feature-list li::before, :root:not([data-theme="light"]) .feature-list li::before{color:var(--forest-dk);}
  .room-side{display:flex;flex-direction:column;gap:16px;}

  /* ---------- Map card ---------- */
  .map-card{border-radius:20px;border:1px solid var(--line);overflow:hidden;background:var(--card);box-shadow:var(--shadow);}
  .map-visual{aspect-ratio:16/11;position:relative;overflow:hidden;background:var(--sand);}
  .map-visual iframe{width:100%;height:100%;display:block;border:0;}
  .map-info{padding:20px 22px 22px;}
  .map-info .addr{font-family:'Fraunces',serif;font-weight:560;font-size:17px;margin-bottom:4px;}
  .map-info .addr-sub{font-size:13.5px;opacity:0.7;margin-bottom:16px;}
  .map-note{font-size:11.5px;opacity:0.55;margin-top:10px;}

  /* ---------- How it works strip ---------- */
  .how-strip{padding:26px 0;border-top:1px solid var(--line);background:var(--paper-2);}
  .how-row{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;}
  .how-item{display:flex;flex-direction:column;gap:2px;flex:1 1 140px;min-width:140px;}
  .how-item .hk{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;opacity:0.55;}
  .how-item .hv{font-family:'Fraunces',serif;font-weight:560;font-size:19px;color:var(--forest);}
  :root[data-theme="dark"] .how-item .hv, :root:not([data-theme="light"]) .how-item .hv{color:var(--forest-dk);}

  /* ---------- Referral banner ---------- */
  .ref-band{padding:52px 0;border-top:1px solid var(--line);}
  .ref-card{background:var(--forest);border-radius:22px;padding:38px 40px;display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap;box-shadow:var(--shadow);}
  .ref-card, .ref-card *{color:#f5f0e6;}
  :root[data-theme="dark"] .ref-card, :root:not([data-theme="light"]) .ref-card{background:var(--forest-dk);}
  :root[data-theme="dark"] .ref-card, :root:not([data-theme="light"]) .ref-card, :root[data-theme="dark"] .ref-card *, :root:not([data-theme="light"]) .ref-card *{color:#12140f;}
  .ref-card .eyebrow{color:inherit;opacity:0.75;}
  .ref-card .eyebrow::before{background:currentColor;opacity:0.6;}
  .ref-card h3{font-size:26px;max-width:26ch;}
  .ref-card p{opacity:0.85;max-width:48ch;margin-top:8px;font-size:14.5px;}
  .ref-card .btn-ghost{border-color:rgba(245,240,230,0.5);}
  :root[data-theme="dark"] .ref-card .btn-ghost, :root:not([data-theme="light"]) .ref-card .btn-ghost{border-color:rgba(18,20,15,0.35);}

  /* ---------- Tarifas (short-stay plans) ---------- */
  .plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:6px;}
  @media (max-width:900px){ .plan-grid{grid-template-columns:1fr;} }
  .plan-card{border:1px solid var(--line);border-radius:18px;padding:26px 24px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;}
  .plan-card h3{font-size:21px;}
  .plan-card .plan-occ{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--clay);}
  .plan-card .plan-room{font-size:14px;opacity:0.75;margin-top:2px;}
  .plan-card .plan-price{font-family:'Fraunces',serif;font-weight:560;font-size:24px;color:var(--forest);margin-top:10px;}
  :root[data-theme="dark"] .plan-card .plan-price, :root:not([data-theme="light"]) .plan-card .plan-price{color:var(--forest-dk);}
  .plan-card .plan-price small{font-family:'Karla',sans-serif;font-size:11.5px;font-weight:700;opacity:0.55;text-transform:uppercase;}
  .kids-box{margin-top:26px;padding:20px 22px;border-radius:16px;background:var(--paper-2);border:1px solid var(--line);}
  .kids-box h4{font-size:16px;margin-bottom:6px;}
  .kids-box p{font-size:14px;opacity:0.78;margin:0;}

  /* ---------- Legal hub / doc pages ---------- */
  .legal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  @media (max-width:760px){ .legal-grid{grid-template-columns:1fr;} }
  .legal-card{border:1px solid var(--line);border-radius:16px;padding:22px 24px;background:var(--card);text-decoration:none;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);}
  .legal-card h3{font-size:18px;}
  .legal-card p{font-size:13.5px;opacity:0.7;margin:0;}
  .legal-card .lc-cta{font-size:12.5px;font-weight:700;color:var(--clay);margin-top:auto;}
  .legal-doc{max-width:74ch;}
  .legal-doc .intro{font-size:14.5px;opacity:0.7;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .legal-doc p{font-size:15px;line-height:1.7;margin:0 0 18px;opacity:0.9;}
  .legal-doc .source-note{font-size:12px;opacity:0.5;margin-top:26px;}

  .biz-info{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media (max-width:760px){ .biz-info{grid-template-columns:1fr 1fr;} }
  @media (max-width:460px){ .biz-info{grid-template-columns:1fr;} }
  .biz-info div{font-size:12.5px;}
  .biz-info .bk{display:block;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;opacity:0.5;font-size:10.5px;margin-bottom:3px;}

  .site-footer{padding:40px 0 30px;font-size:13.5px;border-top:1px solid var(--line);}
  .footer-grid{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .footer-cols{display:flex;gap:56px;flex-wrap:wrap;}
  .footer-col h4{font-size:12.5px;text-transform:uppercase;letter-spacing:0.07em;opacity:0.55;margin-bottom:12px;font-weight:700;}
  .footer-col a, .footer-col p{display:block;text-decoration:none;opacity:0.8;margin:0 0 8px;font-size:14px;}
  .footer-col a:hover{opacity:1;color:var(--clay);}
  .footer-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;opacity:0.6;font-size:12.5px;}
  .footer-legal{opacity:0.55;font-size:12px;max-width:60ch;margin-top:14px;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  @media (max-width:1024px){ .wrap{padding-inline:22px;} .hero-grid{gap:34px;} }
  @media (max-width:640px){
    body{font-size:15px;}
    .wrap{padding-inline:18px;}
    .topbar-inner{padding:13px 18px;gap:10px;}
    .logo{font-size:17px;}
    .topbar-actions{gap:8px;}
    .lang-toggle button{padding:5px 9px;font-size:11.5px;}
    .btn{padding:10px 16px;font-size:13.5px;}
    .demo-note .wrap{padding:8px 18px;font-size:12px;}
    .hero{padding:26px 0 30px;}
    .hero h1{font-size:2rem;}
    .hero p.lead{font-size:15.5px;}
    .stat-row{gap:20px;}
    .stat b{font-size:21px;}
    .hero-media{aspect-ratio:4/4.6;}
    .units-section{padding:12px 0 44px;}
    .location{padding:44px 0;}
    .cta-band{padding:48px 0;}
    .footer-grid{flex-direction:column;gap:26px;}
    .footer-cols{gap:30px;}
    .footer-bottom{flex-direction:column;gap:6px;}
    .loc-list{grid-template-columns:1fr 1fr;gap:14px;}
    .unit-hero{padding:16px 0 12px;}
    .spec-card{padding:18px;}
    .viewer-wrap{aspect-ratio:4/3.4;border-radius:16px;}
    .viewer-hint{font-size:11px;padding:6px 10px;top:12px;left:12px;}
    .viewer-badge{font-size:10px;padding:6px 10px;top:12px;right:12px;}
    .viewer-roomlabel{font-size:12px;padding:7px 12px;left:12px;bottom:12px;}
    .thumb-item{width:118px;}
    .gallery-arrow{width:32px;height:32px;}
    .gallery-arrow svg{width:15px;height:15px;}
    .gallery-nav{gap:6px;}
  }
  @media (max-width:380px){
    .hero h1{font-size:1.7rem;}
    .stat-row{gap:14px;}
    .loc-list{grid-template-columns:1fr;}
  }

  /* ---------- Booking modal & flow ---------- */
  .modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(20,20,15,0.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .modal-card{background:var(--paper);border-radius:22px;max-width:640px;width:100%;box-shadow:0 30px 70px -20px rgba(0,0,0,0.5);position:relative;margin:auto 0;}
  .modal-close{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--ink);z-index:2;}
  .modal-close:hover{border-color:var(--clay);color:var(--clay);}
  .modal-body{padding:32px 30px 30px;}
  @media (max-width:640px){ .modal-body{padding:26px 20px 22px;} .modal-overlay{padding:0;} .modal-card{border-radius:0;min-height:100vh;} }

  .bk-steps{display:flex;gap:6px;margin-bottom:22px;}
  .bk-step-dot{height:4px;flex:1;border-radius:999px;background:var(--line);}
  .bk-step-dot.done{background:var(--forest);}
  :root:not([data-theme="light"]) .bk-step-dot.done{background:var(--forest-dk);}
  .bk-step-dot.active{background:var(--clay);}
  .bk-head{margin-bottom:20px;}
  .bk-head .eyebrow{margin-bottom:8px;}
  .bk-head h3{font-size:22px;}
  .bk-head p{font-size:13.5px;opacity:0.7;margin-top:6px;}

  .cal-card{border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;background:var(--card);}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-nav b{font-family:'Fraunces',serif;font-size:16px;font-weight:560;text-transform:capitalize;}
  .cal-nav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:15px;}
  .cal-nav button:disabled{opacity:0.3;cursor:not-allowed;}
  .cal-nav button:not(:disabled):hover{border-color:var(--clay);color:var(--clay);}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
  .cal-weekdays span{text-align:center;font-size:10.5px;font-weight:700;text-transform:uppercase;opacity:0.5;padding:4px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-day{aspect-ratio:1;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;}
  .cal-day:disabled{opacity:0.25;cursor:not-allowed;}
  .cal-day.empty{visibility:hidden;cursor:default;}
  .cal-day:not(:disabled):not(.empty):hover{background:var(--paper-2);}
  .cal-day.in-range{background:var(--sand);border-radius:0;}
  .cal-day.range-start{background:var(--forest);color:#f5f0e6;border-radius:8px 0 0 8px;}
  .cal-day.range-end{background:var(--forest);color:#f5f0e6;border-radius:0 8px 8px 0;}
  .cal-day.range-start.range-end{border-radius:8px;}
  :root:not([data-theme="light"]) .cal-day.range-start, :root:not([data-theme="light"]) .cal-day.range-end{color:#12140f;}
  :root[data-theme="light"] .cal-day.range-start, :root[data-theme="light"] .cal-day.range-end{color:#f5f0e6;}
  .cal-day.occupied::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;}
  .cal-day.occupied-confirmed::after{background:var(--clay);}
  .cal-day.occupied-hold::after{background:var(--ochre);}
  .cal-day:disabled.occupied{text-decoration:line-through;}
  .cal-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;opacity:0.75;}
  .cl-item{display:flex;align-items:center;gap:6px;}
  .cl-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;}
  .cl-dot.cl-confirmed{background:var(--clay);}
  .cl-dot.cl-hold{background:var(--ochre);}
  .cal-summary{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .cal-summary .cs-item{font-size:12.5px;}
  .cal-summary .cs-item b{display:block;font-family:'Fraunces',serif;font-size:16px;font-weight:560;}
  .avail-msg{width:100%;margin:10px 0 0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .avail-msg.avail-yes{color:var(--forest);}
  .avail-msg.avail-no{color:var(--clay);}
  .avail-msg.avail-checking{opacity:0.6;font-weight:600;}
  .hold-card{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px;text-align:center;}
  .hold-card .hc-label{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--clay);}
  .hold-card .hc-unit{font-family:'Fraunces',serif;font-size:18px;margin-top:6px;}
  .hold-card .hc-timer-label{font-size:11px;opacity:0.6;margin-top:14px;text-transform:uppercase;letter-spacing:0.05em;}
  .hold-card .hc-timer{font-family:'Fraunces',serif;font-size:38px;font-weight:560;color:var(--clay);margin-top:4px;}
  .hold-card .hc-note{font-size:12.5px;opacity:0.7;margin-top:10px;}
  .hold-expired{background:rgba(182,96,60,0.1);border:1px solid rgba(182,96,60,0.3);border-radius:16px;padding:20px;text-align:center;margin-bottom:20px;}
  .hold-expired p{margin:0 0 14px;font-weight:600;}
  .payment-card{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:20px;}
  .payment-card .payment-disclaimer{font-size:12.5px;opacity:0.7;margin:0 0 12px;}
  .payment-rows{display:flex;flex-direction:column;gap:9px;}
  .payment-row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;border-bottom:1px dashed var(--line);padding-bottom:9px;}
  .payment-row:last-child{border-bottom:none;padding-bottom:0;}
  .payment-row span{opacity:0.65;}
  .payment-row b{font-family:'Fraunces',serif;font-weight:560;text-align:right;}
  .pay-method-grid{display:flex;flex-direction:column;gap:10px;}
  .payment-report-form{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:20px;}
  .payment-reported{background:rgba(51,81,63,0.1);border:1px solid rgba(51,81,63,0.3);border-radius:16px;padding:18px 20px;margin-bottom:20px;text-align:center;}
  .payment-reported p{margin:0;font-weight:600;color:var(--forest);}
  .guest-select{display:flex;align-items:center;gap:12px;margin-top:16px;}
  .guest-select label{font-size:13px;font-weight:700;opacity:0.7;}
  .stepper{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:999px;padding:4px;}
  .stepper button{width:28px;height:28px;border-radius:50%;border:none;background:var(--paper-2);cursor:pointer;font-size:16px;font-weight:700;color:var(--ink);}
  .stepper button:disabled{opacity:0.35;cursor:not-allowed;}

  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function isoLocal(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function nightsBetween(checkinIso, checkoutIso){
    var out = [];
    var d = new Date(checkinIso+'T00:00:00');
    var end = new Date(checkoutIso+'T00:00:00');

    // bloquear — se trata exactamente igual que una reserva rechazada/cancelada. Sin esto,
    // un HOLD abandonado dejaría esas fechas bloqueadas para siempre, que es otra forma de
    // "mentir" sobre la disponibilidad real.
    function isHoldExpired(r){
      return r.type === 'reserva' && r.status === 'pendiente' && r.expiresAt
        && r.paymentStatus !== 'submitted' && new Date(r.expiresAt).getTime() < Date.now();

    // campo manual desconectado de las reservas reales — se recalcula contra las reservas
    // reales de esa unidad, igual que FirebaseDataProvider. Un HOLD 'pendiente' vigente
    // (todavía no vencido, ver isHoldExpired) cuenta igual que una confirmada — el cliente ya
    // está a mitad de una reserva real, no hace falta esperar a que un admin la confirme a
    // mano para que el resto de visitantes lo vea reflejado (bug real reportado: "el sitio no
    // actualiza el estado en el flujo del cliente"). Rechazada/cancelada o un HOLD ya vencido
    // nunca cuentan, para no dejar la unidad "atascada" como ocupada tras un abandono.
    function effectiveStatus(typeKey, num, rawStatus){

      var hasActive = false, hasFuture = false;
      loadReservations().forEach(function(r){
        if(r.type !== 'reserva' || r.unitType !== typeKey || r.unitNum !== num) return;
        var isLiveHold = r.status === 'pendiente' && !isHoldExpired(r);
        if(r.status !== 'confirmada' && !isLiveHold) return;
        if(r.checkin <= today && today < r.checkout) hasActive = true;
        else if(r.checkin > today) hasFuture = true;
      });
      if(hasActive) return 'en-uso';
      if(hasFuture) return 'reservado';
      return rawStatus;
    }

      return units.map(function(u){
        var eff = effectiveStatus(typeKey, u.num, u.status);
        if(eff === u.status) return u;
        var copy = {}; Object.keys(u).forEach(function(k){ copy[k] = u[k]; });
        copy.status = eff;
        return copy;

      if(!cat) return null;
      var out = {}; Object.keys(cat).forEach(function(k){ out[k] = cat[k]; });

      var cat = UNITS[typeKey];
      return cat ? withEffectiveStatus(typeKey, cat.units) : [];

    // Reservas y citas: viven en localStorage bajo una sola clave, igual que antes de
    // Fase 4 — lo único que cambia es que ahora se exponen con la misma interfaz async
    // que FirebaseDataProvider (create/get/getMy/setStatus, todas devuelven Promise) para
    // que ReservationService/VisitService no necesiten saber cuál de los dos está activo.
    var RESERVATIONS_KEY = 'usoInmobiliario_reservas_v1';
    function loadReservations(){
      try{
        var raw = localStorage.getItem(RESERVATIONS_KEY);
        return raw ? JSON.parse(raw) : [];
      }catch(e){ return []; }
    }
    function saveReservations(list){
      try{ localStorage.setItem(RESERVATIONS_KEY, JSON.stringify(list)); }catch(e){}

    // demostrar en vivo ahora mismo, sin depender de que exista un panel de administrador
    // (Fase 6) que confirme/rechace manualmente antes de que el bloqueo aplique.
    function overlappingReservations(list, unitType, unitNum, checkin, checkout){
      var nights = nightsBetween(checkin, checkout);
      return list.filter(function(r){
        if(r.type !== 'reserva' || r.unitType !== unitType || r.unitNum !== unitNum || !isBlocking(r)) return false;
        var otherNights = nightsBetween(r.checkin, r.checkout);
        return nights.some(function(n){ return otherNights.indexOf(n) !== -1; });

    function hasNightOverlap(list, unitType, unitNum, checkin, checkout){
      return overlappingReservations(list, unitType, unitNum, checkin, checkout).length > 0;
    }
    function isSlotTaken(list, unitType, unitNum, visitDate, visitTime){
      return list.some(function(r){
        return r.type === 'cita' && r.unitType === unitType && r.unitNum === unitNum

      });
    }
    function createReservation(rec){
      var list = loadReservations();
      if(list.some(function(r){ return r.code === rec.code; })){
        var err = new Error('code-collision'); err.code = 'code-collision';
        return Promise.reject(err);

      if(rec.type === 'reserva' && hasNightOverlap(list, rec.unitType, rec.unitNum, rec.checkin, rec.checkout)){

        return Promise.reject(e2);

      // específica que pueda chocar, así que no aplica el chequeo de slot ocupado.
      if(rec.type === 'cita' && rec.appointmentType !== 'general_visit' && isSlotTaken(list, rec.unitType, rec.unitNum, rec.visitDate, rec.visitTime)){
        var e3 = new Error('slot-taken'); e3.code = 'slot-taken';
        return Promise.reject(e3);

      saveReservations(list);
      return Promise.resolve(rec);
    }
    function getReservation(code){
      var rec = loadReservations().filter(function(r){ return r.code === code; })[0] || null;
      return Promise.resolve(rec);
    }
    function getMyReservations(){
      // En Local, "mis reservas" y "todas" son lo mismo: todo vive en este navegador.
      return Promise.resolve(loadReservations());
    }
    function setReservationStatus(code, status){
      var list = loadReservations();
      var rec = list.filter(function(r){ return r.code === code; })[0];
      if(rec){ rec.status = status; saveReservations(list); }
      return Promise.resolve(rec || null);
    }
    // Disponibilidad real por rango de fechas — misma lógica de traslape que ya usa
    // createReservation, expuesta aparte para que el calendario del modal pueda consultarla
    // en vivo mientras el usuario elige fechas, antes de intentar crear nada. `reason`
    // distingue una reserva ya CONFIRMADA (bloqueo definitivo) de un HOLD todavía pendiente
    // (sección 22 del pedido).
    function checkAvailability(typeKey, num, checkinIso, checkoutIso){
      var list = loadReservations();
      var blocking = overlappingReservations(list, typeKey, num, checkinIso, checkoutIso);
      if(!blocking.length) return Promise.resolve({ available: true });
      var reason = blocking.some(function(r){ return r.status === 'confirmada'; })
        ? 'confirmed_reservation' : 'temporary_hold';
      return Promise.resolve({ available: false, reason: reason });
    }
    // Mapa {fechaIso: reason} de todas las noches ya ocupadas de una unidad (reservas
    // 'pendiente'/'confirmada' vigentes, sin contar HOLDs vencidos ni rechazadas/canceladas)
    // — alimenta el calendario del modal para marcar cada día como ocupado/disponible.
    function getOccupiedDates(typeKey, num){
      var out = {};
      loadReservations().forEach(function(r){
        if(r.type !== 'reserva' || r.unitType !== typeKey || r.unitNum !== num || !isBlocking(r)) return;
        var reason = r.status === 'confirmada' ? 'confirmed_reservation' : 'temporary_hold';
        nightsBetween(r.checkin, r.checkout).forEach(function(n){
          if(out[n] !== 'confirmed_reservation') out[n] = reason;
        });
      });
      return Promise.resolve(out);
    }
    // El cliente elige método de pago (bank_transfer/cash) para una reserva ya creada — se
    // guarda una sola vez, mismo criterio que reportPayment (transición de un solo sentido).
    function setPaymentMethod(code, method){
      var list = loadReservations();
      var rec = list.filter(function(r){ return r.code === code; })[0];
      if(!rec) return Promise.reject(new Error('reservation-not-found'));
      rec.paymentMethod = method;
      saveReservations(list);
      return Promise.resolve(rec);
    }

    // Configuración de pago del negocio — en Local es el equivalente a UNITS/STATUS_META
    // (la fuente de verdad de este provider, no un valor inventado en la plantilla de la
    // UI). En Firebase esto mismo vive en settings/paymentInfo, administrable sin tocar código.
    var PAYMENT_INFO = {
      bankName: 'Bancolombia',
      accountHolder: 'Yessica Paola González Granada',
      accountType: 'Ahorros',
      accountNumber: '31138361619'
    };
    function getPaymentInfo(){ return PAYMENT_INFO; }
    // Reporte de pago: transición de un solo sentido ('none' -> 'submitted'), igual que en
    // Firebase — una vez reportado, no se puede volver a reportar ni revertir desde aquí.
    function reportPayment(code, report){
      var list = loadReservations();
      var rec = list.filter(function(r){ return r.code === code; })[0];
      if(!rec) return Promise.reject(new Error('reservation-not-found'));
      if(rec.paymentStatus !== 'none') return Promise.reject(new Error('already-reported'));
      rec.paymentStatus = 'submitted';
      rec.paymentReport = report;
      saveReservations(list);
      return Promise.resolve(rec);
    }

    return {
      checkAvailability: checkAvailability,
      getOccupiedDates: getOccupiedDates,
      getCategoryKeys: getCategoryKeys,
      getCategory: getCategory,
      getApartments: getApartments,
      getStatusMeta: getStatusMeta,
      createReservation: createReservation,
      getReservation: getReservation,
      getMyReservations: getMyReservations,
      setReservationStatus: setReservationStatus,
      setPaymentMethod: setPaymentMethod,
      reportPayment: reportPayment,
      getPaymentInfo: getPaymentInfo

  var ApartmentService = (function(){

    function categoryExists(typeKey){ return !!DataProvider.getCategory(typeKey); }
    function getCategory(typeKey){ return DataProvider.getCategory(typeKey); }
    function getApartments(typeKey){ return DataProvider.getApartments(typeKey); }

  var PricingService = (function(){
    function hasPublishedRates(unit){ return !!unit.one; }
    var TIER_LABELS = ['night','2-6','weekly','monthly'];
    // Desglose completo de la tarifa aplicada — se guarda tal cual en la reserva al crearla
    // (ver ReservationService.buildRecord) para que una tarifa futura distinta nunca altere
    // retroactivamente el precio de una reserva ya hecha (snapshot histórico).
    function priceBreakdown(unit, nights, guests){
      if(!hasPublishedRates(unit)) return null;
      var tierIdx;
      if(nights <= 1) tierIdx = 0;
      else if(nights <= 6) tierIdx = 1;
      else if(nights < 30) tierIdx = 2;
      else tierIdx = 3;
      var baseRate = guests >= 2 ? unit.two[tierIdx] : unit.one[tierIdx];
      var baseTotal = baseRate * nights;
      var extraGuests = Math.max(0, guests - 2);
      var extraRate = (extraGuests > 0 && unit.extra) ? unit.extra[tierIdx] : 0;
      var extraTotal = extraGuests * extraRate * nights;
      return {
        tier: TIER_LABELS[tierIdx], nights: nights, guests: guests,
        baseRate: baseRate, baseTotal: baseTotal,
        extraGuests: extraGuests, extraRate: extraRate, extraTotal: extraTotal,
        discountTotal: 0,
        total: baseTotal + extraTotal,
        currency: 'COP'
      };
    }
    // Lógica real ya existente en el sistema, solo reubicada aquí (antes vivía como
    // computeEstimate() dentro del módulo BOOKING) — la fórmula NO cambió, ahora es un
    // envoltorio delgado sobre priceBreakdown() para no duplicar la fórmula dos veces.
    function calculatePrice(unit, nights, guests){
      var b = priceBreakdown(unit, nights, guests);
      return b ? b.total : null;
    }
    return { hasPublishedRates: hasPublishedRates, calculatePrice: calculatePrice, priceBreakdown: priceBreakdown };
  })();

  /* Horario real de atención (Lun-Vie 8:00-12:30 y 2:00-6:00pm, Sáb 8:30-1:00pm, domingo
     cerrado) — antes vivía como WEEKDAY_SLOTS/SATURDAY_SLOTS/slotsForDate() dentro de BOOKING.
     La disponibilidad real por fechas contra otras reservas (chequeo de solapamiento) todavía
     NO existe en el sistema — queda pendiente para cuando haya una fuente central (Firebase). */
  var AvailabilityService = (function(){
    var WEEKDAY_SLOTS = ['08:00','09:00','10:00','11:00','12:00','14:00','15:00','16:00','17:00'];
    var SATURDAY_SLOTS = ['08:30','09:30','10:30','11:30'];
    function todayMidnight(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
    function isPastDate(date){ return date < todayMidnight(); }
    function isBusinessOpenOn(date){ return date.getDay() !== 0; }
    function getVisitSlots(date){
      var dow = date.getDay();
      if(dow === 0) return [];
      if(dow === 6) return SATURDAY_SLOTS;
      return WEEKDAY_SLOTS;
    }
    function isUnitBookable(unit){ return unit.status === 'disponible'; }
    // Disponibilidad real para un rango de fechas concreto — distinta del badge
    // disponible/en-uso/reservado de la unidad (ver DataProvider.getApartments): esta
    // consulta considera TODOS los HOLDs/reservas vigentes (no solo las confirmadas) para
    // esas noches puntuales, ignorando los que ya expiraron sin pago.
    function checkAvailability(typeKey, num, checkinIso, checkoutIso){
      return DataProvider.checkAvailability(typeKey, num, checkinIso, checkoutIso);
    }
    // Mapa {fechaIso: 'confirmed_reservation'|'temporary_hold'} de TODAS las noches ya
    // ocupadas de una unidad — a diferencia de checkAvailability (un rango puntual), esto
    // alimenta el calendario para pintar cada día como ocupado/disponible antes de que el
    // visitante elija nada, en vez de solo avisar después de escoger un rango inválido.
    function getOccupiedDates(typeKey, num){
      return DataProvider.getOccupiedDates(typeKey, num);
    }
    return {
      todayMidnight: todayMidnight,
      isPastDate: isPastDate,
      isBusinessOpenOn: isBusinessOpenOn,
      getVisitSlots: getVisitSlots,
      isUnitBookable: isUnitBookable,
      checkAvailability: checkAvailability,
      getOccupiedDates: getOccupiedDates
    };
  })();

  /* Reservas de estadía. Única puerta de entrada a los datos de reservas/citas para el
     resto del código (antes vivía dentro de BOOKING) — expone _buildRecord/_createRecord
     que VisitService reutiliza para compartir la misma lógica de creación sin duplicarla.
     Desde Fase 4 esta capa es async: crear/leer una reserva es una llamada real a Firebase
     (o, en modo Local, una Promise que resuelve al toque) — nunca toca localStorage ni
     Firebase directamente, se lo pide a DataProvider, igual que ApartmentService. */
  var ReservationService = (function(){
    function genCode(){
      var letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      var l = '';
      for(var i=0;i<3;i++) l += letters.charAt(Math.floor(Math.random()*letters.length));
      var n = String(Math.floor(Math.random()*1000));
      while(n.length<3) n = '0'+n;
      return l + n;
    }
    function buildRecord(data, type){
      var rec = {
        code: genCode(), type: type, createdAt: new Date().toISOString(),
        unitType: data.unitType, unitNum: data.unitNum, unitLabel: data.unitLabel,
        name: data.name, phone: data.phone, email: data.email, notes: data.notes,
        status: 'pendiente'
      };
      if(type === 'reserva'){
        rec.checkin = data.checkin; rec.checkout = data.checkout; rec.nights = data.nights;
        rec.guests = data.guests; rec.estTotal = data.estTotal;
        if(data.priceSnapshot) rec.priceSnapshot = data.priceSnapshot;
        // HOLD de 15 minutos: mientras no se reporte un pago, estas fechas quedan
        // reservadas para este cliente y bloqueadas para cualquier otro — pero solo hasta
        // expiresAt. Las citas no compiten por un recurso escaso de la misma forma, no
        // llevan HOLD. expiresAt se guarda como número (epoch ms, no ISO) a propósito: las
        // rules de Firebase comparan contra la variable `now` (también numérica) para poder
        // liberar un HOLD vencido de forma atómica — un string ISO no se podría comparar así.
        rec.expiresAt = Date.now() + HOLD_DURATION_MS;
        rec.paymentStatus = 'none';
      } else {
        rec.visitDate = data.visitDate; rec.visitTime = data.visitTime;
        // Visita a un apartamento puntual vs. visita general ("quiero conocer las opciones
        // disponibles", sin comprometerse a una unidad todavía) — se distingue por si vino
        // con unitType/unitNum o no. El admin decide después qué unidades mostrar en una
        // visita general (no hay "matching" automático, no se inventa esa lógica de negocio).
        rec.appointmentType = data.unitType ? 'specific_visit' : 'general_visit';
        if(!data.unitType){ delete rec.unitType; delete rec.unitNum; }
      }
      return rec;
    }
    // El código es aleatorio (AAA000) y con 26^3*1000 ≈ 17.5M combinaciones una colisión de
    // código es realísticamente imposible — pero como Firebase no permite "listar todos los
    // códigos" para chequearlo de antemano (por diseño: evita que cualquiera pueda enumerar
    // reservas ajenas), la única forma real de garantizarlo es dejar que el create() atómico
    // lo rechace si de casualidad ya existe, y reintentar UNA vez con un código nuevo. Esto
    // es DISTINTO de un conflicto de fechas/turno ocupado (err.code 'dates-taken'/'slot-taken'/
    // 'conflict', ver DataProvider.createReservation) — ahí un código nuevo no ayudaría en
    // nada, así que esos errores se dejan pasar sin reintento, directo hasta la UI.
    function createRecord(data, type){
      var rec = buildRecord(data, type);
      return DataProvider.createReservation(rec).catch(function(err){
        if(err && err.code === 'code-collision'){
          var rec2 = buildRecord(data, type);
          return DataProvider.createReservation(rec2);
        }
        throw err;
      });
    }
    function createReservation(data){ return createRecord(data, 'reserva'); }
    function getReservation(code){
      code = (code||'').trim().toUpperCase();
      return DataProvider.getReservation(code);
    }
    function getAll(){ return DataProvider.getMyReservations(); } // reservas + citas creadas en este navegador, para "Mi reserva"
    function setStatus(code, status){ return DataProvider.setReservationStatus(code, status); }
    function confirmReservation(code){ return setStatus(code, 'confirmada'); }
    function rejectReservation(code){ return setStatus(code, 'rechazada'); }
    function cancelReservation(code){ return setStatus(code, 'cancelada'); }
    function completeReservation(code){ return setStatus(code, 'completada'); }
    function checkReservationStatus(code){ return getReservation(code).then(function(r){ return r ? r.status : null; }); }
    function reportPayment(code, report){ return DataProvider.reportPayment(code, report); }
    function setPaymentMethod(code, method){ return DataProvider.setPaymentMethod(code, method); }
    function getPaymentInfo(){ return DataProvider.getPaymentInfo(); }
    return {
      _createRecord: createRecord,
      createReservation: createReservation, getReservation: getReservation,
      getAll: getAll, confirmReservation: confirmReservation, rejectReservation: rejectReservation,
      cancelReservation: cancelReservation, completeReservation: completeReservation,
      checkReservationStatus: checkReservationStatus,
      reportPayment: reportPayment, setPaymentMethod: setPaymentMethod, getPaymentInfo: getPaymentInfo
    };
  })();

  /* ---------------- PaymentProvider (Bloque A, sección 39 del pedido) ----------------
     Capa delgada entre BOOKING/ReservationService y el método de pago real. Hoy solo hay
     dos implementaciones manuales (transferencia y efectivo); el día que exista una pasarela
     externa de verdad, se agrega un tercer provider aquí sin tocar ReservationService ni la
     UI del modal — todo lo que la UI necesita saber de un provider es su `method` y sus dos
     posibles pasos (`select` siempre; `report` solo si el método lo requiere). */
  var ManualBankTransferProvider = {
    method: 'bank_transfer',
    select: function(code){ return ReservationService.setPaymentMethod(code, 'bank_transfer'); },
    report: function(code, report){ return ReservationService.reportPayment(code, report); }
  };
  var CashPaymentProvider = {
    method: 'cash',
    select: function(code){ return ReservationService.setPaymentMethod(code, 'cash'); }
    // Sin `report`: el efectivo no lo confirma el cliente — lo registra un administrador
    // desde Unity (Bloque C, todavía no construido). Aquí solo se dejan las fechas en HOLD
    // con el método elegido, listas para que ese panel las encuentre.
  };
  var PaymentProvider = { bank_transfer: ManualBankTransferProvider, cash: CashPaymentProvider };

  /* ---------------- Email transaccional de reserva ----------------
     EmailService decide QUÉ enviar (nunca genera el código ni recalcula precio — solo arma
     {code, email} a partir de la reserva YA creada) y EmailProvider hace la llamada real.
     El HTML del correo YA NO se construye acá — ahora lo arma emailService.js del lado del
     servidor (mismo diseño, portado tal cual, ver whatsapp-assistant/src/emailService.js):
     ese backend busca la reserva completa por código, así que reconstruir el HTML dos veces
     (acá y allá) sería una copia que se puede desincronizar sin que nadie lo note, no una
     capa útil. */
  // Backend compartido por el chat web y el correo transaccional — el mismo servicio de
  // Render que ya atiende el bot de WhatsApp (whatsapp-assistant/), ahora con rutas nuevas
  // para estos dos canales (ver el plan de "chat web + correo gratis + middleware admin").
  var BACKEND_BASE_URL = 'https://usoinmobiliario-whatsapp-bot.onrender.com';

  // Conteo de tráfico del sitio para el panel de analíticas (usoinmobiliario-middleware) —
  // SOLO un contador agregado por día y por página en el backend (ver
  // whatsapp-assistant/src/firebase.js:recordPageview): ni cookies, ni IP, ni ningún
  // identificador de visitante viajan en este POST, así que no hay nada que desactivar con
  // Do Not Track para cumplir su espíritu — igual se respeta por si acaso. keepalive:true para
  // que el conteo no se pierda si el usuario ya está navegando a la página siguiente cuando el
  // POST todavía no salió; fire-and-forget real (nunca bloquea ni rompe la navegación si el
  // backend está dormido/caído, a diferencia del chat que sí necesita avisar del error).
  function trackPageview(path){
    try{
      if(navigator.doNotTrack === '1') return;
      fetch(BACKEND_BASE_URL + '/track/pageview', {
        method: 'POST', keepalive: true, headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ path: path || '/' })
      }).catch(function(){});
    }catch(e){ /* nunca debe romper la navegación real */ }
  }

  // Reemplaza el Worker de Cloudflare + Amazon SES (bloqueado por depender de una cuenta AWS
  // sin acceso confiable) — ahora es una ruta del mismo backend de Render, que envía por SMTP
  // de Gmail con la cuenta real del negocio. El endpoint busca la reserva completa del lado
  // del servidor por código y exige que el correo coincida con el guardado antes de enviar
  // nada (nunca confía en datos sueltos del cliente) — por eso `email` va en el payload aunque
  // antes no hacía falta.
  var EmailProvider = {
    isConfigured: function(){ return true; }, // el backend siempre existe; puede fallar con 'not-configured' si falta GMAIL_APP_PASSWORD ahí, ver emailService.js
    send: function(templateParams){
      var payload = {
        code: templateParams.reservation_code,
        email: templateParams.to_email,
        lang: LANG
      };
      return fetch(BACKEND_BASE_URL + '/email/reservation-confirmation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function(res){
        if(!res.ok){
          return res.json().catch(function(){ return {}; }).then(function(data){
            var err = new Error('email-send-error'); err.code = (data && data.error) || ('http-'+res.status);
            throw err;
          });
        }
        return res.json();
      });
    }
  };

  var EmailService = (function(){
    // Nunca crea reservas, nunca confirma pagos, nunca toca disponibilidad/HOLD — solo pide
    // el envío de una reserva YA creada. El backend busca el resto (nombre, fechas, precio,
    // estado) por su cuenta a partir del código — acá no hace falta rearmar nada de eso.
    function sendReservationCreated(res){
      if(!res || res.type !== 'reserva' || !res.email) return Promise.resolve({skipped:true});
      return EmailProvider.send({ to_email: res.email, reservation_code: res.code });
    }
    return { sendReservationCreated: sendReservationCreated };
  })();

  /* ---------------- Tarjeta de reserva (imagen descargable) ----------------
     Alternativa a pedirle a un modelo de IA que "dibuje" el código: los modelos de
     generación de imágenes son conocidos por NO renderizar texto exacto de forma
     confiable (podrían mostrar un código distinto al real) — justo el único dato que acá
     no puede fallar. Esta tarjeta se dibuja con Canvas 2D, código real, sin costo y sin
     depender de ningún servicio externo — mismo estilo visual que ya usa el correo. */
  var CardImage = (function(){
    var MONTHS_LONG = {
      es:['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],
      en:['January','February','March','April','May','June','July','August','September','October','November','December']
    };
    function fmtLong(isoDateStr){
      var p = isoDateStr.split('-');
      var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
      return d.getUTCDate()+' de '+MONTHS_LONG[LANG][d.getUTCMonth()]+' de '+d.getUTCFullYear();
    }
    function roundRect(ctx,x,y,w,h,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.arcTo(x+w,y,x+w,y+h,r);
      ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r);
      ctx.arcTo(x,y,x+w,y,r);
      ctx.closePath();
    }
    function draw(res, categoryLabel){
      var W = 900, H = 1200;
      var canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext('2d');
      var isEs = LANG === 'es';

      ctx.fillStyle = '#f5f0e6';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#33513f';
      ctx.fillRect(0, 0, W, 220);
      ctx.fillStyle = '#f5f0e6';
      ctx.textAlign = 'center';
      ctx.font = '700 36px Georgia, "Times New Roman", serif';
      ctx.fillText('USO INMOBILIARIO', W/2, 110);
      ctx.font = '400 26px Georgia, "Times New Roman", serif';
      ctx.fillText(isEs ? 'Reserva creada' : 'Booking created', W/2, 160);

      roundRect(ctx, 80, 280, W-160, 260, 24);
      ctx.fillStyle = '#e4d8c3';
      ctx.fill();
      ctx.fillStyle = '#9c7b3f';
      ctx.font = '700 22px Georgia, serif';
      ctx.fillText(isEs ? 'CÓDIGO DE RESERVA' : 'BOOKING CODE', W/2, 350);
      ctx.fillStyle = '#33513f';
      ctx.font = '700 92px Georgia, serif';
      ctx.fillText(res.code, W/2, 470);

      var y = 630;
      ctx.textAlign = 'left';
      function row(label, value){
        ctx.font = '400 21px Karla, Arial, sans-serif';
        ctx.fillStyle = '#6b6b60';
        ctx.fillText(label, 90, y);
        ctx.font = '700 27px Karla, Arial, sans-serif';
        ctx.fillStyle = '#20241f';
        ctx.fillText(String(value), 90, y+36);
        y += 96;
      }
      row(isEs?'Apartamento':'Apartment', res.unitLabel);
      if(categoryLabel) row(isEs?'Tipo':'Type', categoryLabel);
      row('Check-in', fmtLong(res.checkin));
      row('Check-out', fmtLong(res.checkout));
      if(res.nights) row(isEs?'Noches':'Nights', res.nights);

      ctx.fillStyle = '#e4d8c3';
      ctx.fillRect(0, H-90, W, 90);
      ctx.fillStyle = '#6b6b60';
      ctx.textAlign = 'center';
      ctx.font = '400 20px Karla, Arial, sans-serif';
      ctx.fillText('Uso Inmobiliario · Laureles, Medellín', W/2, H-40);

      return canvas;
    }
    function downloadCard(res, categoryLabel){
      var canvas = draw(res, categoryLabel);
      canvas.toBlob(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'reserva-' + res.code + '.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      });
    }
    return { draw: draw, downloadCard: downloadCard };
  })();

  /* Citas/visitas presenciales — proceso independiente de las reservas (nunca se mezclan),
     pero comparten la misma lógica de creación/almacenamiento vía _createRecord. */
  var VisitService = (function(){
    function createVisit(data){ return ReservationService._createRecord(data, 'cita'); }
    function getVisit(code){ return ReservationService.getReservation(code); }
    function confirmVisit(code){ return ReservationService.confirmReservation(code); }
    function cancelVisit(code){ return ReservationService.cancelReservation(code); }
    function getAvailableVisitSlots(date){ return AvailabilityService.getVisitSlots(date); }
    return {

  var svgArrows ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3 5 7l4 4M5 7h14M15 21l4-4-4-4M19 17H5"/></svg>';
  var svg360 = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15.5 0 18M12 3c-2.5 2.5-2.5 15.5 0 18"/></svg>';
  var svgChevLeft = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
  var svgChevRight = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  var galResizeHandler = null;

  /* ---------------- 360 panorama viewer (three.js) ---------------- */
  var PANO = (function(){
    var renderer, scene, camera, mesh, container, raf, resizeHandler;
    var lon=0, lat=0, isDown=false, sx=0, sy=0, lon0=0, lat0=0;

    function init(el, src, opts){
      dispose();
      opts = opts || {};
      container = el;
      var w = Math.max(el.clientWidth,1), h = Math.max(el.clientHeight,1);
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(opts.fov || 75, w/h, 1, 1100);
      var geometry = new THREE.SphereGeometry(500, 60, 40);
      geometry.scale(-1,1,1);
      var material = new THREE.MeshBasicMaterial();
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);
      renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
      renderer.setSize(w,h);
      el.appendChild(renderer.domElement);
      lon = opts.lon || 0; lat = opts.lat || 0;
      load(src);
      bindEvents();
      animate();
    }
    function load(src){
      if(!mesh) return;
      // src puede ser una URL (unidades, como siempre) o un <canvas> ya compuesto
      // (Street View real del hero, armado a partir de tiles — ver StreetViewPano).
      if(src && src.tagName === 'CANVAS'){
        var canvasTex = new THREE.CanvasTexture(src);
        canvasTex.needsUpdate = true;
        mesh.material.map = canvasTex;
        mesh.material.needsUpdate = true;
        return;
      }
      var loader = new THREE.TextureLoader();
      loader.load(src, function(tex){
        if(!mesh) return;
        mesh.material.map = tex;
        mesh.material.needsUpdate = true;
      });
    }
    function resetView(opts){
      opts = opts || {};
      lon = opts.lon || 0; lat = opts.lat || 0;
    }
    function animate(){
      raf = requestAnimationFrame(animate);
      if(!camera) return;
      var phi = THREE.MathUtils.degToRad(90-lat);
      var theta = THREE.MathUtils.degToRad(lon);
      var target = new THREE.Vector3(
        500*Math.sin(phi)*Math.cos(theta),
        500*Math.cos(phi),
        500*Math.sin(phi)*Math.sin(theta)
      );
      camera.lookAt(target);
      renderer.render(scene, camera);
    }
    function onDown(e){
      isDown = true; container.classList.add('dragging');
      sx = e.touches ? e.touches[0].clientX : e.clientX;
      sy = e.touches ? e.touches[0].clientY : e.clientY;
      lon0 = lon; lat0 = lat;
    }
    function onMove(e){
      if(!isDown) return;
      var x = e.touches ? e.touches[0].clientX : e.clientX;
      var y = e.touches ? e.touches[0].clientY : e.clientY;
      lon = (sx - x) * 0.18 + lon0;
      lat = (y - sy) * 0.18 + lat0;
      lat = Math.max(-85, Math.min(85, lat));
    }
    function onUp(){ isDown=false; if(container) container.classList.remove('dragging'); }
    function bindEvents(){
      container.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      container.addEventListener('touchstart', onDown, {passive:true});
      container.addEventListener('touchmove', onMove, {passive:true});
      container.addEventListener('touchend', onUp);
      resizeHandler = function(){
        if(!container || !renderer) return;
        var w = Math.max(container.clientWidth,1), h = Math.max(container.clientHeight,1);
        camera.aspect = w/h; camera.updateProjectionMatrix();
        renderer.setSize(w,h);
      };
      window.addEventListener('resize', resizeHandler);
    }
    function dispose(){
      if(raf) cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      if(resizeHandler) window.removeEventListener('resize', resizeHandler);
      if(renderer){
        renderer.dispose();
        if(renderer.domElement && renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
      }
      renderer=null; scene=null; camera=null; mesh=null; container=null; raf=null; resizeHandler=null;
      lon=0; lat=0; isDown=false;
    }
    return {init:init, load:load, resetView:resetView, dispose:dispose};
  })();

  /* ---------------- Panorama real de Street View (sin API key) ----------------
     Google no expone el equirectangular completo de un panoid en una sola URL — el
     propio visor web de Google lo arma del lado del cliente pegando mosaicos ("tiles")
     de 512x512 sobre un canvas. Reutilizamos el MISMO endpoint que usa esa interfaz
     (streetviewpixels-pa.googleapis.com/v1/tile), que no requiere API key y permite
     lectura cross-origin del canvas resultante (verificado: crossOrigin="anonymous" +
     canvas.toDataURL() no lanza SecurityError). El canvas compuesto se le pasa a
     PANO.load() como si fuera cualquier otra textura.
     zoom=3 → mosaico de 8x4 tiles = 4096x2048px: nítido de sobra para el panel del
     hero, carga rápido (32 tiles) y muy por debajo del límite de textura WebGL
     soportado universalmente (incluidos móviles/GPUs modestas). Este panoid sí tiene
     disponible hasta zoom=5 (32x16 = 16384x8192, la resolución máxima que existe para
     esta fotografía) — subir ZOOM_FINAL más abajo es una línea si se prioriza
     resolución máxima por sobre velocidad de carga y compatibilidad universal. */
  var StreetViewPano = (function(){
    var TILE = 512;
    var cache = {};
    function tileURL(panoid, zoom, x, y){
      return 'https://streetviewpixels-pa.googleapis.com/v1/tile?cb_client=maps_sv.tactile&panoid='+panoid+'&x='+x+'&y='+y+'&zoom='+zoom+'&nbt=1&fov=180';
    }
    function loadTile(ctx, panoid, zoom, x, y, retriesLeft){
      return new Promise(function(resolve){
        function attempt(remaining){
          var img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = function(){ ctx.drawImage(img, x*TILE, y*TILE, TILE, TILE); resolve(); };
          img.onerror = function(){
            // Reintenta un par de veces (fallo de red transitorio) antes de rendirse.
            // Solo si sigue fallando se deja esa franja en negro — hoy quedaba negra
            // permanentemente al primer error, sin ningún reintento.
            if(remaining > 0) attempt(remaining-1);
            else resolve();
          };
          img.src = tileURL(panoid, zoom, x, y) + '&_r=' + remaining; // evita caché de un 404 previo
        }
        attempt(retriesLeft);
      });
    }
    function buildCanvas(panoid, zoom){
      var cacheKey = panoid+'_'+zoom;
      if(cache[cacheKey]) return cache[cacheKey];
      var cols = Math.pow(2, zoom);
      var rows = zoom === 0 ? 1 : Math.pow(2, zoom-1);
      var canvas = document.createElement('canvas');
      canvas.width = cols*TILE;
      canvas.height = rows*TILE;
      var ctx = canvas.getContext('2d');
      var jobs = [];
      for(var y=0; y<rows; y++){
        for(var x=0; x<cols; x++){
          jobs.push(loadTile(ctx, panoid, zoom, x, y, 2));
        }
      }
      var promise = Promise.all(jobs).then(function(){ return canvas; });
      cache[cacheKey] = promise;
      return promise;
    }
    return { buildCanvas: buildCanvas };

    function occupiedReasonAt(iso){ return (state.occupiedDates && state.occupiedDates[iso]) || null; }
    // true si alguna noche en [from, to) (fechas Date, "to" exclusivo) ya está ocupada —
    // impide elegir un checkout que "salte por encima" de una reserva ajena en el medio.
    // Un checkout que caiga EXACTAMENTE en un día ocupado sigue siendo válido (esa noche no
    // se consume al hacer checkout esa mañana, es el mismo día de turnover que usaría el
    // siguiente huésped) — por eso el límite es "to" exclusivo, no inclusivo.

      var d = new Date(from);

    function renderCalendar(){

        var cls = 'cal-day';
        if(isVisit){
          if(state.visitDate && date.getTime()===state.visitDate.getTime()) cls += ' range-start range-end';
        } else {

          if(occReason) cls += ' occupied occupied-' + (occReason === 'confirmed_reservation' ? 'confirmed' : 'hold');
          if(!disabled){
            // Como checkout (checkin ya elegido, checkout todavía no, y esta fecha es
            // posterior) un día ocupado sigue siendo válido en sí mismo — solo se bloquea si
            // el TRAMO entre el checkin y esta fecha atraviesa alguna noche ya tomada (así
            // se detecta incluso cuando el propio día candidato no está ocupado, pero el
            // camino hasta llegar a él sí pasa por encima de una reserva/hold ajena). En
            // cualquier otro caso (primer clic, o reinicio del rango) un día ocupado en sí
            // mismo nunca es un checkin válido.
            var pickingCheckout = state.checkin && !state.checkout && date.getTime() > state.checkin.getTime();
            if(pickingCheckout) disabled = hasOccupiedNightBetween(state.checkin, date);
            else if(occReason) disabled = true;
          }
          if(state.checkin && date.getTime()===state.checkin.getTime()) cls += ' range-start';
          if(state.checkout && date.getTime()===state.checkout.getTime()) cls += ' range-end';
          if(state.checkin && state.checkout && date > state.checkin && date < state.checkout) cls += ' in-range';
        }
        html += '<button type="button" class="'+cls+'" '+(disabled?'disabled':'')+' data-date="'+isoDate(date)+'">'+d+'</button>';
      }

          + '<div class="cs-item"><span>'+t('bkVisitTime')+'</span><b>'+(state.visitTime||'—')+'</b></div>'

    function checkDatesAvailability(){
      if(!state.checkin || !state.checkout) return;

      state.lastCheckedRange = key;
      state.datesAvailable = 'checking';

      var myId = ++state.availCheckId;
      AvailabilityService.checkAvailability(state.typeKey, state.unit.num, isoDate(state.checkin), isoDate(state.checkout))
        .then(function(res){
          if(!state || state.availCheckId !== myId) return; // el usuario ya cambió de fechas o cerró el modal
