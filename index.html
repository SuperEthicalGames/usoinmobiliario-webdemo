        + (canContinue?'':'<p class="catalog-note" style="margin-top:10px;">'+(isVisit?t('visitPickTime'):t('bkPickDates'))+'</p>');
      setBody(html);
      bindCalendar();
      if(!isVisit) checkDatesAvailability();
      if(isVisit){
        var slotGrid = document.querySelector('.slot-grid');
        if(slotGrid) slotGrid.addEventListener('click', function(e){
          var btn = e.target.closest('.slot-btn');
          if(!btn) return;
          state.visitTime = btn.getAttribute('data-slot');
          renderStep1();
        });
      } else {
        var gm = document.getElementById('guestMinus'), gp = document.getElementById('guestPlus');
        if(gm) gm.addEventListener('click', function(){ if(state.guests>1){ state.guests--; renderStep1(); } });
        if(gp) gp.addEventListener('click', function(){ if(state.guests<state.unit.maxPersons){ state.guests++; renderStep1(); } });
      }
      var next1 = document.getElementById('bkNext1');
      if(next1) next1.addEventListener('click', function(){ if(canContinue){ state.step=2; render(); } });
    }

    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    // El correo es obligatorio solo para reservas (necesitamos poder enviarle el código y
    // los detalles) — las citas conservan el campo opcional tal como ya funcionaba, sin
    // tocar ese flujo (sección 38 del pedido: no cambiar innecesariamente lo de visitas).
    function emailRequiredForMode(){ return state.mode !== 'cita'; }
    function emailFieldOk(email){ return emailRequiredForMode() ? EMAIL_RE.test(email) : (email === '' || EMAIL_RE.test(email)); }

    function step2FieldsValid(){
      var name = document.getElementById('fName').value.trim();
      var phoneLocal = document.getElementById('fPhone').value.trim();
      var email = document.getElementById('fEmail').value.trim();
      var consent = document.getElementById('fConsent').checked;
      var phoneDigits = phoneLocal.replace(/[^0-9]/g,'');
      return name.length>=3 && phoneDigits.length>=7 && consent && emailFieldOk(email);
    }

    // Refleja el estado del campo correo en vivo (normal/válido/error) mientras el
    // visitante escribe — no espera al último paso para avisar (sección 6 del pedido).
    function refreshEmailFieldState(){
      var input = document.getElementById('fEmail');
      var errEl = document.getElementById('errEmail');
      if(!input || !errEl) return;
      var val = input.value.trim();
      if(val === ''){
        input.classList.remove('bk-field-error','bk-field-valid');
        errEl.classList.remove('show');
      } else if(EMAIL_RE.test(val)){
        input.classList.remove('bk-field-error'); input.classList.add('bk-field-valid');
        errEl.classList.remove('show');
      } else {
        input.classList.remove('bk-field-valid'); input.classList.add('bk-field-error');
        errEl.textContent = t('bkEmailInvalidErr');
        errEl.classList.add('show');
      }
    }
    // El aviso de "correo obligatorio" solo aparece al salir del campo (blur) si quedó
    // vacío — no al cargar la pantalla ni en cada tecla, para no sentirse agresivo.
    function checkEmailRequiredOnBlur(){
      if(!emailRequiredForMode()) return;
      var input = document.getElementById('fEmail');
      if(input.value.trim() !== '') return;
      input.classList.remove('bk-field-valid'); input.classList.add('bk-field-error');
      var errEl = document.getElementById('errEmail');
      errEl.textContent = t('bkEmailRequiredErr');
      errEl.classList.add('show');
    }

    function renderStep2(){
      var isVisitMode = state.mode === 'cita';
      var initialValid = state.name.trim().length>=3 && state.phoneLocal.replace(/[^0-9]/g,'').length>=7 && state.consent && emailFieldOk(state.email);
      var emailLabelKey = isVisitMode ? 'bkEmailOptional' : 'bkEmail';
      var html = stepDotsHtml()
        + '<div class="bk-head"><p class="eyebrow">'+t('bkStepInfo')+'</p><h3>'+t('bkInfoTitle')+'</h3><p>'+(state.mode==='cita'?t('bkInfoSubVisit'):t('bkInfoSub'))+'</p></div>'
        + '<div class="bk-field"><label>'+t('bkName')+' <span class="req">*</span></label>'
        +   '<input type="text" id="fName" placeholder="'+t('bkNamePh')+'" value="'+escHtml(state.name)+'">'
        +   '<div class="bk-error-msg" id="errName">'+t('bkNameErr')+'</div></div>'
        + '<div class="bk-field"><label>'+t('bkPhone')+' <span class="req">*</span></label>'
        +   '<div class="phone-row">'
        +     '<div class="phone-cc">'
        +       '<select id="fPhoneCountry" aria-label="'+t('bkPhoneCountry')+'">'+countryOptionsHtml(state.phoneCountry)+'</select>'
        +       '<span class="phone-cc-display" id="fPhoneCountryDisplay" aria-hidden="true"></span>'
        +     '</div>'
        +     '<input type="tel" id="fPhone" placeholder="'+t('bkPhonePh')+'" value="'+escHtml(state.phoneLocal)+'">'
        +   '</div>'
        +   '<div class="bk-error-msg" id="errPhone">'+t('bkPhoneErr')+'</div></div>'
        + '<div class="bk-field"><label>'+t(emailLabelKey)+(isVisitMode?'':' <span class="req">*</span>')+'</label>'
        +   '<input type="email" id="fEmail" placeholder="'+t('bkEmailPh')+'" value="'+escHtml(state.email)+'">'
        +   (isVisitMode ? '' : '<div class="bk-field-hint">'+t('bkEmailHelp')+'</div>')
        +   '<div class="bk-error-msg" id="errEmail">'+t('bkEmailInvalidErr')+'</div></div>'
        + '<div class="bk-field"><label>'+t('bkNotes')+'</label>'
        +   '<textarea id="fNotes" placeholder="'+t('bkNotesPh')+'">'+escHtml(state.notes)+'</textarea></div>'
        + '<label class="bk-check"><input type="checkbox" id="fConsent" '+(state.consent?'checked':'')+'>'
        +   '<span>'+t('bkConsent').replace('{policy}','<a href="#/legal/politica-datos" target="_blank">'+t('bkConsentPolicy')+'</a>').replace('{rules}','<a href="#/legal/reglamento" target="_blank">'+t('bkConsentRules')+'</a>')+'</span></label>'
        + '<div class="bk-error-msg" id="errConsent">'+t('bkConsentErr')+'</div>'
        + '<div class="bk-actions"><button type="button" class="btn btn-ghost" id="bkBack2">← '+t('bkBack')+'</button><button type="button" class="btn btn-primary" id="bkNext2" '+(initialValid?'':'disabled')+'>'+t('bkContinue')+' →</button></div>'
        + '<p class="catalog-note" id="step2Hint" style="margin-top:10px;'+(initialValid?'display:none;':'')+'">'+t('bkCompleteInfo')+'</p>';
      setBody(html);
      var ccSelect = document.getElementById('fPhoneCountry');
      var ccDisplay = document.getElementById('fPhoneCountryDisplay');
      ccDisplay.innerHTML = phoneCountryCompact(ccSelect);
      ccSelect.addEventListener('change', function(){ ccDisplay.innerHTML = phoneCountryCompact(ccSelect); });
      var next2 = document.getElementById('bkNext2');
      var hint2 = document.getElementById('step2Hint');
      function refreshNext2(){
        var valid = step2FieldsValid();
        next2.disabled = !valid;
        hint2.style.display = valid ? 'none' : '';
      }
      refreshEmailFieldState();
      ['fName','fPhone','fEmail'].forEach(function(id){
        document.getElementById(id).addEventListener('input', refreshNext2);
      });
      document.getElementById('fEmail').addEventListener('input', refreshEmailFieldState);
      document.getElementById('fEmail').addEventListener('blur', checkEmailRequiredOnBlur);
      document.getElementById('fConsent').addEventListener('change', refreshNext2);
      document.getElementById('bkBack2').addEventListener('click', function(){ state.step=1; render(); });
      next2.addEventListener('click', validateStep2);
    }

    function toggleFieldError(fieldId, errId, isError){
      document.getElementById(fieldId).classList.toggle('bk-field-error', isError);
      document.getElementById(errId).classList.toggle('show', isError);
    }

    function validateStep2(){
      state.name = document.getElementById('fName').value.trim();
      state.phoneCountry = document.getElementById('fPhoneCountry').value;
      state.phoneLocal = document.getElementById('fPhone').value.trim();
      state.email = document.getElementById('fEmail').value.trim();
      state.notes = document.getElementById('fNotes').value.trim();
      state.consent = document.getElementById('fConsent').checked;

      var ok = true;
      var phoneDigits = state.phoneLocal.replace(/[^0-9]/g,'');
      var nameBad = state.name.length < 3;
      toggleFieldError('fName','errName', nameBad); if(nameBad) ok=false;
      var phoneBad = phoneDigits.length < 7;
      toggleFieldError('fPhone','errPhone', phoneBad); if(phoneBad) ok=false;
      state.phone = '+'+state.phoneCountry+' '+state.phoneLocal;
      var emailEmpty = state.email === '';
      var emailOk = emailFieldOk(state.email);
      toggleFieldError('fEmail','errEmail', !emailOk);
      if(!emailOk){
        document.getElementById('errEmail').textContent = (emailRequiredForMode() && emailEmpty) ? t('bkEmailRequiredErr') : t('bkEmailInvalidErr');
        ok = false;
      } else {
        document.getElementById('fEmail').classList.toggle('bk-field-valid', state.email !== '');
      }
      document.getElementById('errConsent').classList.toggle('show', !state.consent);
      if(!state.consent) ok=false;

      if(ok){ state.step=3; render(); }
    }

    function renderStep3(){
      var isVisit = state.mode === 'cita';
      var html = stepDotsHtml()
        + '<div class="bk-head"><p class="eyebrow">'+t('bkStepReview')+'</p><h3>'+t('bkReviewTitle')+'</h3><p>'+(isVisit?t('visitReviewSub'):t('bkReviewSub'))+'</p></div>'
        + '<div class="bk-review">'
        +   '<div class="bk-review-row"><span class="k">'+t('bkRUnit')+'</span><span class="v">'+(state.unit?unitLabel(state.unit)+' · '+state.unitTypeLabel:t('generalVisitLabel'))+'</span></div>';
      if(isVisit){
        html += '<div class="bk-review-row"><span class="k">'+t('bkRVisitDate')+'</span><span class="v">'+fmtDate(state.visitDate)+'</span></div>'
          +   '<div class="bk-review-row"><span class="k">'+t('bkRVisitTime')+'</span><span class="v">'+state.visitTime+'</span></div>';
      } else {
        var nights = Math.round((state.checkout-state.checkin)/86400000);
        html += '<div class="bk-review-row"><span class="k">'+t('bkRDates')+'</span><span class="v">'+fmtDate(state.checkin)+' → '+fmtDate(state.checkout)+'</span></div>'
          +   '<div class="bk-review-row"><span class="k">'+(nights===1?t('bkNight'):t('bkNights'))+'</span><span class="v">'+nights+'</span></div>'
          +   '<div class="bk-review-row"><span class="k">'+t('bkRGuests')+'</span><span class="v">'+state.guests+'</span></div>'
          +   (state.estTotal!=null ? '<div class="bk-review-row"><span class="k">'+t('bkRTotal')+'</span><span class="v">'+fmtCOP(state.estTotal)+'</span></div>' : '');
      }
      html += '<div class="bk-review-row"><span class="k">'+t('bkRName')+'</span><span class="v">'+escHtml(state.name)+'</span></div>'
        +   '<div class="bk-review-row"><span class="k">'+t('bkRPhone')+'</span><span class="v">'+escHtml(state.phone)+'</span></div>'
        +   (state.email ? '<div class="bk-review-row"><span class="k">'+t('bkREmail')+'</span><span class="v">'+escHtml(state.email)+'</span></div>' : '')
        + '</div>'
        + '<p class="bk-submit-error" id="bkSubmitError" style="display:none;color:#c0392b;margin:0 0 12px;font-size:14px;"></p>'
        + '<div class="bk-actions"><button type="button" class="btn btn-ghost" id="bkBack3">← '+t('bkBack')+'</button><button type="button" class="btn btn-primary" id="bkSubmit">'+(isVisit?t('bkConfirmBtnVisit'):t('bkConfirmBtn'))+' →</button></div>';
      setBody(html);
      document.getElementById('bkBack3').addEventListener('click', function(){ state.step=2; render(); });
      document.getElementById('bkSubmit').addEventListener('click', submitReservation);
    }

    function submitReservation(){
      var isVisit = state.mode === 'cita';
      var btn = document.getElementById('bkSubmit');
      var errEl = document.getElementById('bkSubmitError');
      if(errEl) errEl.style.display = 'none';
      if(btn){ btn.disabled = true; btn.textContent = t('bkSubmitting'); }

      var payload = {
        unitType: state.unit ? state.typeKey : undefined,
        unitNum: state.unit ? state.unit.num : undefined,
        unitLabel: state.unit ? unitLabel(state.unit) : t('generalVisitLabel'),
        name: state.name,
        phone: state.phone,
        email: state.email,
        notes: state.notes
      };
      var promise;
      if(isVisit){
        payload.visitDate = isoDate(state.visitDate);
        payload.visitTime = state.visitTime;
        promise = VisitService.createVisit(payload);
      } else {
        payload.checkin = isoDate(state.checkin);
        payload.checkout = isoDate(state.checkout);
        payload.nights = Math.round((state.checkout-state.checkin)/86400000);
        payload.guests = state.guests;
        payload.estTotal = state.estTotal;
        payload.priceSnapshot = PricingService.priceBreakdown(state.unit, payload.nights, state.guests);
        promise = ReservationService.createReservation(payload);
      }
      promise.then(function(res){
        // El usuario pudo navegar fuera del modal (o cerrarlo) mientras la escritura seguía
        // en curso — si ya no estamos en el paso 3 de esta misma reserva, no pisar la UI.
        if(!state || state.step !== 3) return;
        state.reservation = res;
        state.step = 4;
        // El correo se dispara DESPUÉS de que Firebase ya guardó la reserva (nunca antes) y
        // nunca bloquea ni revierte nada si falla (sección 12/13/34 del pedido) — es un canal
        // de comunicación, no la fuente de verdad. Las citas no llevan email obligatorio ni
        // este correo (sección 30/38: alcance limitado a reservas).
        state.emailStatus = isVisit ? null : 'sending';
        render();
        if(!isVisit) sendReservationEmail(res);
      }).catch(function(err){
        console.error('No se pudo guardar la reserva/cita:', err);
        if(!state || state.step !== 3) return;
        var btn2 = document.getElementById('bkSubmit');
        var errEl2 = document.getElementById('bkSubmitError');
        if(btn2){ btn2.disabled = false; btn2.textContent = (isVisit?t('bkConfirmBtnVisit'):t('bkConfirmBtn'))+' →'; }
        var msgKey = 'bkSubmitError';
        if(err && (err.code === 'dates-taken' || err.code === 'conflict') && !isVisit) msgKey = 'bkSubmitErrorDates';
        else if(err && (err.code === 'slot-taken' || err.code === 'conflict') && isVisit) msgKey = 'bkSubmitErrorSlot';
        if(errEl2){ errEl2.textContent = t(msgKey); errEl2.style.display = 'block'; }
      });
    }

    // Se llama una sola vez, justo después de que Firebase confirmó la reserva (nunca antes,
    // nunca para reintentar sola por un refresh/vuelta atrás — ver el guard de state.step/
    // reservation.code en cada callback). Si falla, solo actualiza el aviso visual: la
    // reserva ya existe y el código ya es visible desde antes de esto (sección 13/34).
    function sendReservationEmail(res){
      EmailService.sendReservationCreated(res).then(function(){
        if(!state || state.step !== 4 || !state.reservation || state.reservation.code !== res.code) return;
        state.emailStatus = 'sent';
        renderStep4();
      }).catch(function(err){
        console.warn('[Email] No se pudo enviar la confirmación de reserva ('+res.code+'):', err && err.code || err);
        if(!state || state.step !== 4 || !state.reservation || state.reservation.code !== res.code) return;
        state.emailStatus = 'failed';
        renderStep4();
      });
    }

    function renderStep4(){
      var res = state.reservation;
      var isVisit = res.type === 'cita';
      if(state.countdownInterval){ clearInterval(state.countdownInterval); state.countdownInterval = null; }

      // Un HOLD (reserva pendiente sin pago) que ya venció mientras el cliente estaba en
      // esta misma pantalla no debe seguir empujando "confirmar por WhatsApp" — esas fechas
      // ya se liberaron para otros, hay que mandarlo de vuelta a elegir de nuevo.
      if(!isVisit && isHoldExpired(res)){
        var expHtml = stepDotsHtml()
          + '<div class="hold-expired"><p>'+t('holdExpiredTitle')+'</p>'
          + '<button type="button" class="btn btn-primary" id="holdExpiredBtn">'+t('holdExpiredBtn')+'</button></div>';
        setBody(expHtml);
        document.getElementById('holdExpiredBtn').addEventListener('click', function(){
          state.step = 1; state.checkin = null; state.checkout = null;
          state.datesAvailable = null; state.lastCheckedRange = null; state.reservation = null;
          render();
        });
        return;
      }

      var waText = buildWaText(res);
      // Una vez reportado el pago, el HOLD ya no puede vencer de verdad (isHoldExpired exige
      // paymentStatus !== 'submitted') — seguir mostrando un reloj corriendo solo generaría
      // ansiedad sin ningún efecto real, así que la tarjeta de cuenta regresiva desaparece.
      var holdHtml = (!isVisit && res.expiresAt && res.paymentStatus !== 'submitted') ? (
          '<div class="hold-card" id="holdCard"><span class="hc-label">'+t('holdTitle')+'</span>'
          + '<div class="hc-unit">'+escHtml(res.unitLabel)+' · '+escHtml(res.checkin)+' → '+escHtml(res.checkout)+'</div>'
          + '<div class="hc-timer-label">'+t('holdTimeLeft')+'</div>'
          + '<div class="hc-timer" id="holdTimer">--:--</div>'
          + '<p class="hc-note">'+t('holdNote')+'</p></div>'
        ) : '';
      var emailStatusHtml = '';
      if(!isVisit && state.emailStatus){
        if(state.emailStatus === 'sending'){
          emailStatusHtml = '<div class="email-status-note sending">'+t('emailSendingMsg')+'</div>';
        } else if(state.emailStatus === 'sent'){
          emailStatusHtml = '<div class="email-status-note sent">'+t('emailSentMsg').replace('{email}', escHtml(res.email))+'</div>';
        } else if(state.emailStatus === 'failed'){
          emailStatusHtml = '<div class="email-status-note failed">'+t('emailFailedMsg1')+' '+t('emailFailedMsg2').replace('{code}', res.code)+'</div>';
        }
      }
      var html = stepDotsHtml()
        + holdHtml
        + '<div id="bkPaymentSection"></div>'
        + '<div class="bk-code-chip"><span class="cc-label">'+(isVisit?t('visitDoneLabel'):t('bkDoneLabel'))+'</span><div class="cc-code">'+res.code+'</div></div>'
        + emailStatusHtml
        + '<p class="bk-confirm-note">'+(isVisit?t('visitDoneNote'):t('bkDoneNote'))+'</p>'
        + '<div class="bk-confirm-actions">'
        +   '<a class="btn btn-primary" href="https://wa.me/573136496615?text='+encodeURIComponent(waText)+'" target="_blank" rel="noopener">'+t('bkSendWa')+' →</a>'
        +   '<button type="button" class="btn btn-ghost" id="bkCopyBtn">'+t('bkCopyCode')+'</button>'
        +   (isVisit ? '' : '<button type="button" class="btn btn-ghost" id="bkDownloadCardBtn">'+t('bkDownloadCard')+'</button>')
        +   '<a class="btn btn-ghost" href="#/mi-reserva?code='+res.code+'" id="bkViewMineLink">'+t('bkViewMine')+'</a>'
        +   '<button type="button" class="btn btn-ghost" id="bkCloseDoneBtn">'+t('bkCloseDone')+'</button>'
        + '</div>';
      setBody(html);
      document.getElementById('bkCopyBtn').addEventListener('click', function(){
        var b = document.getElementById('bkCopyBtn');
        if(navigator.clipboard){
          navigator.clipboard.writeText(res.code).then(function(){
            b.textContent = t('bkCopied');
            setTimeout(function(){ b.textContent = t('bkCopyCode'); }, 1600);
          });
        }
      });
      var downloadCardBtn = document.getElementById('bkDownloadCardBtn');
      if(downloadCardBtn) downloadCardBtn.addEventListener('click', function(){
        var category = ApartmentService.categoryExists(res.unitType) ? ApartmentService.getCategory(res.unitType) : null;
        CardImage.downloadCard(res, category ? category.catLabel[LANG] : '');
      });
      document.getElementById('bkViewMineLink').addEventListener('click', function(){ close(); });
      document.getElementById('bkCloseDoneBtn').addEventListener('click', close);
      if(!isVisit && res.expiresAt && res.paymentStatus !== 'submitted') mountHoldCountdown(res);
      mountPaymentSection(res, 'bkPaymentSection', renderStep4);
    }

    // Cuenta regresiva reconstruida en cada tick a partir de expiresAt (nunca cuenta hacia
    // abajo desde un número guardado en memoria) — por eso sobrevive a un recargo de página:
    // basta con volver a abrir el modal en este código y expiresAt sigue siendo la fuente de
    // verdad. Se limpia en close() y al re-renderizar step4 para no acumular intervalos.
    function mountHoldCountdown(res){
      function tick(){
        var timerEl = document.getElementById('holdTimer');
        if(!timerEl || !state){ clearInterval(state && state.countdownInterval); return; }
        var remaining = new Date(res.expiresAt).getTime() - Date.now();
        if(remaining <= 0){
          clearInterval(state.countdownInterval);
          state.countdownInterval = null;
          renderStep4();
          return;
        }
        timerEl.textContent = fmtCountdown(remaining);
      }
      tick();
      state.countdownInterval = setInterval(tick, 1000);
    }

    function setBody(html){
      var body = document.querySelector('#bkOverlay .modal-body-inner');
      if(body) body.innerHTML = html;
    }

    function render(){
      if(!state) return;
      if(state.step===1) renderStep1();
      else if(state.step===2) renderStep2();
      else if(state.step===3) renderStep3();
      else renderStep4();
    }

    function escHandler(e){ if(e.key==='Escape') close(); }

    function initModalShell(){
      var root = document.getElementById('modalRoot');
      root.innerHTML = '<div class="modal-overlay" id="bkOverlay"><div class="modal-card">'
        + '<button type="button" class="modal-close" id="bkCloseBtn" aria-label="Close">✕</button>'
        + '<div class="modal-body"><div class="modal-body-inner"></div></div>'
        + '</div></div>';
      document.body.style.overflow = 'hidden';
      document.getElementById('bkCloseBtn').addEventListener('click', close);
      document.getElementById('bkOverlay').addEventListener('click', function(e){ if(e.target.id==='bkOverlay') close(); });
      document.addEventListener('keydown', escHandler);
    }

    function open(typeKey, unitCode, mode){
      var u = ApartmentService.getCategory(typeKey);
      var unit = u ? ApartmentService.getApartment(typeKey, unitCode) : null;
      if(!unit) return;
      var today = AvailabilityService.todayMidnight();
      state = {
        typeKey: typeKey, unit: unit, unitTypeLabel: u.shortName[LANG],
        mode: mode === 'cita' ? 'cita' : 'reserva',
        step: 1, viewYear: today.getFullYear(), viewMonth: today.getMonth(),
        checkin: null, checkout: null, guests: Math.min(2, unit.maxPersons),
        visitDate: null, visitTime: null,
        name:'', phone:'', phoneCountry:'57', phoneLocal:'', email:'', notes:'', consent:false, estTotal:null, reservation:null,
        datesAvailable: null, datesAvailableReason: null, lastCheckedRange: null, availCheckId: 0, countdownInterval: null,
        occupiedDates: {}
      };
      initModalShell();
      render();
      loadOccupiedDates();
    }

    // Mapa {fechaIso: reason} de las noches ya ocupadas de la unidad — se pinta en el
    // calendario ANTES de que el visitante elija nada (ver renderCalendar). Se pide una vez
    // al abrir el modal (cubre todos los meses, no hace falta repetir por mes) y de nuevo
    // cada vez que llega una actualización en vivo de Firebase mientras el modal sigue
    // abierto (ver refreshOccupied/window.__uso_refresh), para que la disponibilidad se vea
    // "en tiempo real" y no solo al abrir.
    function loadOccupiedDates(){
      if(!state || state.mode !== 'reserva' || !state.unit) return;
      var myState = state;
      AvailabilityService.getOccupiedDates(state.typeKey, state.unit.num).then(function(map){
        if(state !== myState) return; // el modal se cerró o se reabrió con otra unidad mientras tanto
        state.occupiedDates = map || {};
        if(state.step === 1) renderStep1();
      }).catch(function(err){
        console.error('No se pudo cargar el calendario de disponibilidad:', err);
      });
    }
    function refreshOccupied(){
      if(state && state.mode === 'reserva' && state.unit) loadOccupiedDates();
    }

    // Visita general ("quiero conocer las opciones disponibles", sección 9/11 del pedido) —
    // mismo flujo de citas, pero sin unidad elegida: typeKey/unit quedan null. El admin
    // decide después qué apartamentos mostrar a este visitante (no hay matching automático).
    function openGeneralVisit(){
      var today = AvailabilityService.todayMidnight();
      state = {
        typeKey: null, unit: null, unitTypeLabel: null,
        mode: 'cita',
        step: 1, viewYear: today.getFullYear(), viewMonth: today.getMonth(),
        checkin: null, checkout: null, guests: 1,
        visitDate: null, visitTime: null,

  /* ---------------- Chat web con IA ----------------
     Mismo cerebro que el bot de WhatsApp (whatsapp-assistant/) — comparte assistantCore/
     businessTools en el backend, solo cambia el canal de transporte (POST /chat/web/message
     en vez del webhook de WhatsApp). `sessionId` es el equivalente de un número de teléfono
     para este canal: un id opaco generado en el navegador y guardado en localStorage, nunca
     validado como identidad real (igual que el backend ya trata la clave de conversación como
     un string opaco, sin saber ni importarle qué canal la generó). */
  var CHATWIDGET = (function(){
    var SESSION_KEY = 'usoInmobiliario_chatSession_v1';
    var HISTORY_KEY = 'usoInmobiliario_chatHistory_v1';
    var CHAT_API_URL = BACKEND_BASE_URL + '/chat/web/message';
    var MAX_HISTORY_STORED = 40;

    var state = { open: false, sending: false, messages: [], memSessionId: null };

    function getSessionId(){
      try{
        var id = localStorage.getItem(SESSION_KEY);
        if(!id){
          id = 'web-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
          localStorage.setItem(SESSION_KEY, id);
        }
        return id;
      }catch(e){
        // localStorage puede fallar (modo privado, cuota llena) — un id solo de memoria sigue
        // permitiendo chatear en esta carga de página, simplemente no persiste al recargar.
        if(!state.memSessionId) state.memSessionId = 'web-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
        return state.memSessionId;
      }
    }

    function loadHistory(){
      try{
        var raw = localStorage.getItem(HISTORY_KEY);
        return raw ? JSON.parse(raw) : [];
      }catch(e){ return []; }
    }
    function saveHistory(){
      try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(state.messages.slice(-MAX_HISTORY_STORED))); }catch(e){}
    }

    // Misma convención ligera del backend (markup.js): *negrilla*, _cursiva_, ~tachado~. Se
    // escapa el HTML PRIMERO (el texto es de la IA, nunca se confía en él) y solo después se
    // aplican las etiquetas seguras — así una respuesta del modelo nunca puede inyectar HTML
    // real, por más que el prompt ya le pida no hacerlo.
    // Escapa también comillas — el texto de la IA nunca se confía, e insertarlo sin escapar
    // comillas dentro de un atributo (ver el href de más abajo) permitiría que una respuesta
    // del modelo (por ejemplo, bajo un intento de inyección de prompt que le pida "repetir
    // literalmente" un texto arbitrario) cerrara el atributo href e inyectara uno nuevo
    // (onmouseover=...). Hallazgo real de esta auditoría, no teórico: sin esto, un "link" con
    // una comilla dentro rompía el atributo aunque < > & ya estuvieran escapados.
    function escapeHtml(s){
      return String(s==null?'':s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }
    function formatMessageHtml(text){
      var out = escapeHtml(text);
      out = out.replace(/\*(.+?)\*/g, '<strong>$1</strong>');
      out = out.replace(/_(.+?)_/g, '<em>$1</em>');
      out = out.replace(/~(.+?)~/g, '<s>$1</s>');
      // El bot manda el link real de cada apartamento como texto plano (nunca Markdown) — se
      // vuelve cliqueable acá, después de escapar, nunca antes. Solo http(s): nunca se debe
      // poder colar un esquema "javascript:"/"data:" aunque el modelo lo emita (ver
      // isSafeHttpUrl en BOOKING para el mismo criterio del lado del sitio principal).
      out = out.replace(/(https?:\/\/[^\s&<]+)/g, function(m){
        return /^https?:\/\//i.test(m) ? '<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>' : m;
      });
      out = out.replace(/\n/g, '<br>');
      return out;
    }

    function bubbleHtml(msg){
      var cls = 'chat-bubble ' + (msg.role === 'user' ? 'chat-bubble-user' : 'chat-bubble-bot');
      return '<div class="'+cls+'">'+formatMessageHtml(msg.text)+'</div>';
    }

    function panelHtml(){
      var body = state.messages.length
        ? state.messages.map(bubbleHtml).join('')
        : '<p class="chat-empty-hint">'+t('chatEmptyHint')+'</p>';
      var typing = state.sending ? '<div class="chat-bubble chat-bubble-bot chat-typing"><span></span><span></span><span></span></div>' : '';
      return ''
        + '<div class="chat-panel" role="dialog" aria-label="'+t('chatTitle')+'">'
        +   '<div class="chat-panel-head">'
        +     '<div><div class="chat-panel-title">'+t('chatTitle')+'</div><div class="chat-panel-sub">'+t('chatSubtitle')+'</div></div>'
        +     '<button type="button" class="chat-close" id="chatCloseBtn" aria-label="'+t('chatCloseLabel')+'">✕</button>'
        +   '</div>'
        +   '<div class="chat-panel-body" id="chatBody">'+body+typing+'</div>'
        +   '<form class="chat-panel-input" id="chatForm">'
        +     '<input type="text" id="chatInput" maxlength="1000" autocomplete="off" placeholder="'+t('chatInputPlaceholder')+'" '+(state.sending?'disabled':'')+' />'
        +     '<button type="submit" class="btn btn-primary btn-icon" aria-label="'+t('chatSendLabel')+'" '+(state.sending?'disabled':'')+'>'
        +       '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>'
        +     '</button>'
        +   '</form>'
        + '</div>';
    }

    function launcherHtml(){
      var icon = state.open
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 2-2z"/></svg>';
      return '<button type="button" id="chatLauncherBtn" class="chat-launcher" aria-label="'+t('chatLauncherLabel')+'" aria-expanded="'+(state.open?'true':'false')+'">'+icon+'</button>';
    }

    function render(){
      var root = document.getElementById('chatRoot');
      if(!root) return;
      root.innerHTML = launcherHtml() + (state.open ? panelHtml() : '');
      document.getElementById('chatLauncherBtn').addEventListener('click', toggle);
      if(state.open){
        var closeBtn = document.getElementById('chatCloseBtn');
        if(closeBtn) closeBtn.addEventListener('click', toggle);
        var form = document.getElementById('chatForm');
        if(form) form.addEventListener('submit', onSubmit);
        var body = document.getElementById('chatBody');
        if(body) body.scrollTop = body.scrollHeight;
        var input = document.getElementById('chatInput');
        if(input && !state.sending) input.focus();
      }
    }

    function toggle(){
      state.open = !state.open;
      render();
    }

    function onSubmit(e){
      e.preventDefault();
      var input = document.getElementById('chatInput');
      var text = input.value.trim();
      if(!text || state.sending) return;
      input.value = '';
      state.messages.push({role:'user', text: text});
      state.sending = true;
      saveHistory();
      render();

      fetch(CHAT_API_URL, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ sessionId: getSessionId(), text: text })
      }).then(function(res){
        return res.json().catch(function(){ return {}; }).then(function(data){ return {ok: res.ok, data: data}; });
      }).then(function(result){
        state.sending = false;
        if(result.ok && result.data && result.data.reply){
          state.messages.push({role:'assistant', text: result.data.reply});
        } else {
          var errKey = (result.data && result.data.error === 'rate-limited') ? 'chatRateLimited' : 'chatErrorGeneric';
          state.messages.push({role:'assistant', text: t(errKey)});
        }
        saveHistory();
        render();
      }).catch(function(){
        state.sending = false;
        state.messages.push({role:'assistant', text: t('chatErrorGeneric')});
        saveHistory();
        render();
      });
    }

    function mount(){
      state.messages = loadHistory();
      render();
    }

    return { mount: mount, render: render };
  })();

  // Mensaje de WhatsApp específico para enviar el comprobante de transferencia (sección 12
  // del pedido) — distinto del de arriba: este dice explícitamente "ya pagué" y "adjunto el
  // comprobante", en vez de "quiero confirmar". El cliente adjunta la imagen directamente en
  // WhatsApp — nunca se sube ni se guarda en el sitio ni en Firebase.

  /* ---------------- Reporte de pago (compartido entre el modal BOOKING paso 4 y
     "Mi reserva") ----------------
     Vive en el ámbito exterior (no dentro del cierre de BOOKING) porque ambos lugares lo
     necesitan; BOOKING.escHtml ya está expuesto para exactamente este tipo de reutilización.
     La info bancaria (banco/titular/tipo/número) viene de DataProvider.getPaymentInfo() —
     nunca hardcodeada aquí — y el "reportar pago" es una transición de un solo sentido
     (none -> submitted) que las rules de Firebase/LocalDataProvider hacen cumplir del lado
     de los datos, no solo aquí en la UI. */
  function paymentInstructionsHtml(res, info){

      +   '<div class="payment-row"><span>'+t('paymentAccountType')+'</span><b>'+BOOKING.escHtml(info.accountType)+'</b></div>'
      +   '<div class="payment-row"><span>'+t('paymentAccountNumber')+'</span><b>'+BOOKING.escHtml(info.accountNumber)+'</b></div>'

      + '</div>'
      + '<a class="btn btn-ghost" href="https://wa.me/573136496615?text='+encodeURIComponent(buildProofWaText(res))+'" target="_blank" rel="noopener" style="width:100%;justify-content:center;margin-top:14px;">'+t('sendProofWaBtn')+' →</a>'

  // containerId: dónde pintar (el modal y Mi Reserva usan ids distintos). onUpdate: qué hacer
  // después de reportar con éxito (renderStep4() en el modal, re-buscar en Mi Reserva).
  function mountPaymentSection(res, containerId, onUpdate){
    var el = document.getElementById(containerId);
    if(!el) return;
    var isVisit = res.type === 'cita';
    if(isVisit || res.status !== 'pendiente' || BOOKING.isHoldExpired(res)) { el.innerHTML = ''; return; }
    if(!res.paymentMethod){
      el.innerHTML = paymentMethodChoiceHtml();
      var transferBtn = document.getElementById('payMethodTransferBtn');
      var cashBtn = document.getElementById('payMethodCashBtn');
      var errEl = document.getElementById('payMethodError');
      function chooseMethod(method){
        if(errEl){ errEl.style.display = 'none'; errEl.textContent = ''; }
        transferBtn.disabled = true; cashBtn.disabled = true;
        PaymentProvider[method].select(res.code).then(function(){
          res.paymentMethod = method;
          mountPaymentSection(res, containerId, onUpdate);
        }).catch(function(err){
          console.error('No se pudo guardar el método de pago:', err);
          transferBtn.disabled = false; cashBtn.disabled = false;
          if(errEl){ errEl.textContent = t('payMethodSaveError'); errEl.style.display = 'block'; }
        });
      }
      if(transferBtn) transferBtn.addEventListener('click', function(){ chooseMethod('bank_transfer'); });
      if(cashBtn) cashBtn.addEventListener('click', function(){ chooseMethod('cash'); });
      return;
    }
    if(res.paymentMethod === 'cash'){
      el.innerHTML = cashPaymentHtml();
      return;
    }
    if(res.paymentStatus === 'submitted'){
      var pr = res.paymentReport || {};
      el.innerHTML = '<div class="payment-reported"><p>'+t('paymentReportedNote')+'</p>'
        + '<div class="payment-rows" style="margin-top:14px;text-align:left;">'
        +   '<div class="payment-row"><span>'+t('prDate')+'</span><b>'+BOOKING.escHtml(pr.date||'—')+'</b></div>'
        +   '<div class="payment-row"><span>'+t('prAmount')+'</span><b>'+(pr.amount!=null?fmtCOP(pr.amount):'—')+'</b></div>'
        +   '<div class="payment-row"><span>'+t('prBank')+'</span><b>'+BOOKING.escHtml(pr.bank||'—')+'</b></div>'
        +   '<div class="payment-row"><span>'+t('prReference')+'</span><b>'+BOOKING.escHtml(pr.reference||'—')+'</b></div>'
        +   (BOOKING.isSafeHttpUrl(pr.proofUrl) ? '<div class="payment-row"><span>'+t('prProofUrl')+'</span><b><a href="'+BOOKING.escHtml(pr.proofUrl)+'" target="_blank" rel="noopener">'+t('prProofLinkLabel')+'</a></b></div>' : '')
        + '</div></div>';
      return;
    }
    var info = ReservationService.getPaymentInfo();
    el.innerHTML = paymentInstructionsHtml(res, info);
    var openBtn = document.getElementById('reportPaymentBtn');
    if(openBtn) openBtn.addEventListener('click', function(){
      el.innerHTML = paymentReportFormHtml(res);
      document.getElementById('prSubmitBtn').addEventListener('click', function(){
        var errEl = document.getElementById('paymentReportError');
        var date = document.getElementById('prDate').value;
        var amount = parseFloat(document.getElementById('prAmount').value);
        var bank = document.getElementById('prBank').value.trim();
        var reference = document.getElementById('prReference').value.trim();
        var proofUrl = document.getElementById('prProofUrl').value.trim();
        if(!date || !amount || !bank || !reference){
          errEl.textContent = t('prValidationError'); errEl.style.display = 'block';
          return;
        }
        errEl.style.display = 'none';
        var report = { date: date, amount: amount, bank: bank, reference: reference, reportedAt: new Date().toISOString() };
        if(proofUrl) report.proofUrl = proofUrl;
        var submitBtn = document.getElementById('prSubmitBtn');
        submitBtn.disabled = true; submitBtn.textContent = t('prSubmitting');
        ReservationService.reportPayment(res.code, report).then(function(){
          res.paymentStatus = 'submitted';
          res.paymentReport = report;
          onUpdate();
        }).catch(function(err){
          console.error('No se pudo reportar el pago:', err);
          var submitBtn2 = document.getElementById('prSubmitBtn');
          var errEl2 = document.getElementById('paymentReportError');
          if(submitBtn2){ submitBtn2.disabled = false; submitBtn2.textContent = t('prSubmitBtn'); }
          if(errEl2){ errEl2.textContent = t('prSubmitError'); errEl2.style.display = 'block'; }
        });
      });
    });
  }

  // El reenvío exige escribir de nuevo el correo asociado (sección 19/21 del pedido) — no es
  // una barrera criptográfica real (quien ya vio `res` por el código ya vio `res.email`

  // proporcional al riesgo de esta acción puntual, sin reestructurar el modelo de datos ni
  // las rules (decisión explícita del usuario, ver conversación).
  function resendEmailSectionHtml(res){
    if(res.type !== 'reserva' || !res.email) return '';
    return '<div id="resendEmailWrap" style="margin-top:10px;">'
      + '<button type="button" class="btn btn-ghost" id="resendEmailToggleBtn" style="width:100%;justify-content:center;">'+t('resendEmailBtn')+'</button>'

  function mountResendEmail(res){
    var toggleBtn = document.getElementById('resendEmailToggleBtn');
    var box = document.getElementById('resendEmailBox');
    if(!toggleBtn || !box) return;
    toggleBtn.addEventListener('click', function(){
      var isOpen = box.style.display !== 'none';
      if(isOpen){ box.style.display = 'none'; box.innerHTML = ''; return; }
      box.style.display = 'block';
      box.innerHTML = '<div class="resend-email-box">'
        + '<p style="margin:0 0 6px;font-size:13px;">'+t('resendEmailPrompt')+'</p>'
        + '<input type="email" id="resendEmailInput" placeholder="'+t('bkEmailPh')+'">'
        + '<div class="bk-error-msg" id="resendEmailErr" style="margin-bottom:8px;"></div>'
        + '<div style="display:flex;gap:8px;">'
        +   '<button type="button" class="btn btn-primary" id="resendEmailSubmitBtn" style="flex:1;justify-content:center;">'+t('resendEmailSubmitBtn')+'</button>'
        +   '<button type="button" class="btn btn-ghost" id="resendEmailCancelBtn">'+t('resendEmailCancelBtn')+'</button>'
        + '</div></div>';

      document.getElementById('resendEmailSubmitBtn').addEventListener('click', function(){
        var typed = document.getElementById('resendEmailInput').value.trim().toLowerCase();

          errEl.textContent = t('resendEmailMismatchErr'); errEl.classList.add('show');

          errEl.textContent = t('resendEmailFailedMsg'); errEl.classList.add('show');
          btn.disabled = false; btn.textContent = t('resendEmailSubmitBtn');
        });
      });
    });
  }
  var miReservaCountdownInterval = null;
  // Reconstruye el contador desde expiresAt (nunca desde un número guardado) — por eso
  // sobrevive a un recargo de página: #/mi-reserva?code=X es una URL real, no estado del
  // modal, así que recargar y volver a buscar el mismo código reconstruye el tiempo real.
  // Al llegar a 0 vuelve a pintar el resultado completo (onExpire) para que el pill de
  // estado pase a "expirada" en vez de quedarse congelado en "pago pendiente".
  function mountReservationCountdown(onExpire){
    if(miReservaCountdownInterval) clearInterval(miReservaCountdownInterval);
    var el = document.getElementById('miReservaTimer');
    if(!el) return;
    // data-expires es un atributo HTML, siempre string — Number() lo vuelve a convertir al
    // epoch ms real. new Date(string) intentaría parsearlo como fecha ISO y daría NaN.
    var expiresAt = Number(el.getAttribute('data-expires'));
    function tick(){
      var timerEl = document.getElementById('miReservaTimer');
      if(!timerEl){ clearInterval(miReservaCountdownInterval); return; }
      var remaining = expiresAt - Date.now();
      if(remaining <= 0){ clearInterval(miReservaCountdownInterval); onExpire(); return; }
      timerEl.textContent = BOOKING.fmtCountdown(remaining);
    }
    tick();
    miReservaCountdownInterval = setInterval(tick, 1000);
  }

  function mountMiReservaInteractivity(prefillCode){
    var form = document.getElementById('lookupForm');
    var input = document.getElementById('lookupInput');
    var resultEl = document.getElementById('lookupResult');
    var recentWrap = document.getElementById('recentWrap');

    function doSearch(code){
      if(miReservaCountdownInterval){ clearInterval(miReservaCountdownInterval); miReservaCountdownInterval = null; }
      resultEl.innerHTML = '<p class="lookup-empty">'+t('miReservaSearching')+'</p>';
      ReservationService.getReservation(code).then(function(res){
        resultEl.innerHTML = res ? renderReservationSummary(res) : '<p class="lookup-empty">'+t('miReservaNotFound')+'</p>';
        if(res){
          mountReservationCountdown(function(){ doSearch(code); });
          mountPaymentSection(res, 'miReservaPaymentSection', function(){ doSearch(code); });
          mountResendEmail(res);
          var downloadBtn = document.getElementById('miReservaDownloadCardBtn');
          if(downloadBtn) downloadBtn.addEventListener('click', function(){
            var category = ApartmentService.categoryExists(res.unitType) ? ApartmentService.getCategory(res.unitType) : null;
            CardImage.downloadCard(res, category ? category.catLabel[LANG] : '');
          });
        }
      }).catch(function(err){
        console.error('No se pudo consultar la reserva:', err);
        resultEl.innerHTML = '<p class="lookup-empty">'+t('miReservaNotFound')+'</p>';
      });
    }
    if(form) form.addEventListener('submit', function(e){
      e.preventDefault();
      doSearch(input.value);
    });

    ReservationService.getAll().then(function(all){
      if(all.length && recentWrap){
        recentWrap.innerHTML = '<div class="recent-list"><h4>'+t('recentTitle')+'</h4>'
          + all.slice(0,5).map(function(r){
              var isVisit = r.type === 'cita';
              var meta = isVisit ? (BOOKING.escHtml(r.visitDate)+' · '+BOOKING.escHtml(r.visitTime)) : BOOKING.escHtml(r.checkin);
              return '<a class="recent-item" href="#/mi-reserva?code='+encodeURIComponent(r.code)+'">'
                + '<span class="ri-left"><span class="ri-top"><span class="type-tag type-'+(isVisit?'cita':'reserva')+'">'+(isVisit?t('typeTagCita'):t('typeTagReserva'))+'</span><span class="ri-code">'+BOOKING.escHtml(r.code)+'</span></span><span class="ri-meta">'+BOOKING.escHtml(r.unitLabel)+' · '+meta+'</span></span>'
                + '</a>';
            }).join('')
          + '</div>';
      }
    }).catch(function(err){ console.error('No se pudo cargar el historial de reservas:', err); });
    if(prefillCode) doSearch(prefillCode);
  }

  // statusFilter: 'all' o uno de los valores de STATUS_META (disponible/en-uso/reservado).
  // El legend de estados pasó de ser texto fijo a ser el filtro mismo — un botón por estado
  // más "Todo", cada uno mostrando su conteo real.
  function renderCatalogBody(typeKey, statusFilter){
    var u = ApartmentService.getCategory(typeKey);

  var HERO_PANOID = 'DGZX60iXhWov5m7uAQvskQ';
  var HERO_PANO_ZOOM_PREVIEW = 1; // 2 tiles = casi instantáneo, solo para no mostrar nada vacío
  var HERO_PANO_ZOOM_FINAL = 3;   // 32 tiles = 4096x2048px — ver comentario en StreetViewPano
  // heading/pitch de Google (213.53°/-18.53°) más un offset calibrado a ojo contra la
  // captura de referencia: Street View calcula esos grados para SU propia proyección
  // (FOV horizontal, aspect ratio de esa URL), mientras que three.js con PerspectiveCamera
  // interpreta el FOV como vertical y el contenedor del hero tiene otro aspect ratio —
  // los mismos grados literales no producen el mismo encuadre en ambos sistemas. Se
  // prioriza el resultado visual (igual que la referencia) sobre repetir el número exacto.
  var HERO_PANO_OPTS = { fov: 90, lon: 296, lat: 2 };

  function mountHeroPano(){
    var el = document.getElementById('heroPanoView');
    if(!el) return;
    var shownZoom = -1; // qué nivel de nitidez ya está pintado, para no pisar uno bueno con uno peor
    function show(canvas, zoom){
      // el usuario pudo haber navegado a otra ruta mientras las tiles cargaban —
      // no inicializar un visor 360 sobre un contenedor que ya no está en la página.
      if(!document.body.contains(el)) return;
      if(zoom <= shownZoom) return;
      if(shownZoom === -1) PANO.init(el, canvas, HERO_PANO_OPTS);
      else PANO.load(canvas); // el visor ya existe (por la vista previa) — solo cambia la textura
      shownZoom = zoom;
    }
    // Vista previa borrosa casi instantánea (2 tiles) para no dejar el panel vacío
    // mientras cargan las 32 tiles de la versión nítida — igual que una imagen con
    // placeholder de baja resolución mientras carga la definitiva.
    StreetViewPano.buildCanvas(HERO_PANOID, HERO_PANO_ZOOM_PREVIEW).then(function(c){ show(c, HERO_PANO_ZOOM_PREVIEW); });
    StreetViewPano.buildCanvas(HERO_PANOID, HERO_PANO_ZOOM_FINAL).then(function(c){ show(c, HERO_PANO_ZOOM_FINAL); });
  }

  function mountUnitInteractivity(ctx){
    var key = ctx.key, rooms = ctx.rooms, idx = ctx.idx, unitCode = ctx.unitCode;
    var viewerEl = document.getElementById('panoView');
    var labelEl = document.getElementById('panoLabel');
    var thumbsEl = document.getElementById('panoThumbs');
    var galViewport = document.querySelector('.gallery-viewport');
    var galPrev = document.getElementById('galPrev');
    var galNext = document.getElementById('galNext');
    var dotsEl = document.getElementById('galDots');
    var infoEl = document.getElementById('roomInfo');

    var bookBtn = document.getElementById('bookNowBtn');
    if(bookBtn){
      bookBtn.addEventListener('click', function(){ BOOKING.open(key, unitCode); });
    }
    var tourBookBtn = document.getElementById('tourBookBtn');
    if(tourBookBtn){
      tourBookBtn.addEventListener('click', function(){ BOOKING.open(key, unitCode); });
    }
    var quoteVisitBtn = document.getElementById('quoteVisitBtn');
    if(quoteVisitBtn){
      quoteVisitBtn.addEventListener('click', function(){ BOOKING.open(key, unitCode, 'cita'); });
    }
    if(!viewerEl) return;

    var activeIdx = idx;
    var scrollIndex = 0;

    function trackStep(){
      var first = thumbsEl.querySelector('.thumb-item');
      if(!first) return 160;
      var gap = parseFloat(getComputedStyle(thumbsEl).gap) || 12;
      return first.getBoundingClientRect().width + gap;
    }
    function visibleCount(){
      if(!galViewport) return rooms.length;
      return Math.max(1, Math.floor(galViewport.clientWidth / trackStep()));
    }
    function maxScrollIndex(){ return Math.max(0, rooms.length - visibleCount()); }
    function updateTrack(){
      var step = trackStep();
      scrollIndex = Math.max(0, Math.min(scrollIndex, maxScrollIndex()));
      thumbsEl.style.transform = 'translateX(-' + (scrollIndex*step) + 'px)';
    }
    function ensureVisible(i){
      var vc = visibleCount();
      if(i < scrollIndex) scrollIndex = i;
      else if(i > scrollIndex + vc - 1) scrollIndex = i - vc + 1;
      updateTrack();
    }
    function updateArrows(){
      if(galPrev) galPrev.disabled = activeIdx <= 0;
      if(galNext) galNext.disabled = activeIdx >= rooms.length - 1;
    }

    function setActive(i){
      activeIdx = i;
      thumbsEl.querySelectorAll('.thumb-item').forEach(function(el){
        el.classList.toggle('active', parseInt(el.getAttribute('data-idx'),10) === i);
      });
      if(dotsEl){
        dotsEl.querySelectorAll('.gallery-dot').forEach(function(el){
          el.classList.toggle('active', parseInt(el.getAttribute('data-idx'),10) === i);
        });
      }
      labelEl.textContent = rooms[i].name[LANG];
      infoEl.innerHTML = roomInfoHTML(rooms[i]);
      history.replaceState(null, '', '#/unidad/'+key+'/'+rooms[i].slug+'?u='+unitCode);
      ensureVisible(i);
      updateArrows();
    }

    function goTo(i){
      var clamped = Math.max(0, Math.min(rooms.length - 1, i));
      PANO.load(rooms[clamped].img);
      PANO.resetView();
      setActive(clamped);
    }

    requestAnimationFrame(function(){
      PANO.init(viewerEl, rooms[idx].img);
      setActive(idx);
    });

    thumbsEl.addEventListener('click', function(e){
      var btn = e.target.closest('.thumb-item');
      if(!btn) return;
      goTo(parseInt(btn.getAttribute('data-idx'),10));
    });

    if(dotsEl){
      dotsEl.addEventListener('click', function(e){
        var btn = e.target.closest('.gallery-dot');
        if(!btn) return;
        goTo(parseInt(btn.getAttribute('data-idx'),10));
      });
    }
    if(galPrev) galPrev.addEventListener('click', function(){ goTo(activeIdx - 1); });
    if(galNext) galNext.addEventListener('click', function(){ goTo(activeIdx + 1); });

    galResizeHandler = function(){ ensureVisible(activeIdx); };
    window.addEventListener('resize', galResizeHandler);
  }

  function route(){
    PANO.dispose();
    // El modal de reserva vive en #modalRoot, FUERA de #app (route() solo reemplaza #app) — sin
    // cerrarlo acá, navegar con atrás/adelante o editando el hash a mano mientras el modal está
    // abierto (con un HOLD de 15 min corriendo, o una verificación de disponibilidad en curso)
    // lo dejaba encima de la página nueva, desconectado de lo que el usuario cree estar viendo.
    // Antes solo el link "Consultar esta reserva más tarde" llamaba BOOKING.close() a propósito;
    // cualquier otra forma de navegar lo dejaba huérfano. Bug real encontrado en auditoría.
    if(BOOKING.isOpen()) BOOKING.close();
    if(galResizeHandler){ window.removeEventListener('resize', galResizeHandler); galResizeHandler = null; }
    var hash = location.hash || '#/';
    var hashBody = hash.replace(/^#\/?/, '');
    var qIdx = hashBody.indexOf('?');
    var pathBody = qIdx === -1 ? hashBody : hashBody.slice(0, qIdx);
    var queryBody = qIdx === -1 ? '' : hashBody.slice(qIdx+1);
    var parts = pathBody.split('/').filter(Boolean);
    var params = new URLSearchParams(queryBody);
    var unitCode = params.get('u');
    var tab = params.get('tab');
    var app = document.getElementById('app');
    var html = '';
    var navActive = 'home';
    var unitCtx = null;
    var isHome = false;

    if(parts.length === 0){
      html = renderHome();
      navActive = 'home';
      isHome = true;
    } else if(parts[0] === 'unidad' && parts[1] && ApartmentService.categoryExists(parts[1])){
      unitCtx = renderUnit(parts[1], parts[2], unitCode);
      html = unitCtx.html;
      navActive = parts[1];
    } else if(parts[0] === 'renta-corta'){
      html = renderTarifas();
      navActive = 'rentaCorta';
    } else if(parts[0] === 'legal' && parts[1]){
      html = renderLegalDoc(parts[1]);
      navActive = 'legal';
    } else if(parts[0] === 'legal'){
      html = renderLegalHub();
      navActive = 'legal';
    } else if(parts[0] === 'mi-reserva'){
      html = renderMiReserva(params.get('code'));
      navActive = 'miReserva';
    } else if(parts[0] === 'visitas'){
      html = renderVisitsHub();
      navActive = 'visitas';
    } else {
      html = renderHome();
      isHome = true;
    }

    app.innerHTML = html;
    trackPageview('/' + pathBody);
    document.querySelectorAll('.nav-links a, .mobile-nav a').forEach(function(a){
      a.classList.toggle('is-active', a.getAttribute('data-nav') === navActive);
    });
    if(unitCtx){
      mountUnitInteractivity(unitCtx);
      window.scrollTo(0,0);
    } else if(isHome){
      mountHomeInteractivity(tab || 'estudio');
      mountHeroPano();
      if(tab){
        var target = document.getElementById('catalogo');
        if(target) target.scrollIntoView({block:'start'});
      } else {
        window.scrollTo(0,0);
      }
    } else if(parts[0] === 'mi-reserva'){
      mountMiReservaInteractivity(params.get('code'));
      window.scrollTo(0,0);
    } else if(parts[0] === 'visitas'){
      mountVisitsHubInteractivity();
      window.scrollTo(0,0);
    } else {
      window.scrollTo(0,0);
    }
  }

    document.getElementById('footDos').textContent = ApartmentService.getCategory('dos').shortName[LANG];
    document.getElementById('footContacto').textContent = t('footContacto');
    document.getElementById('footLegal').textContent = t('footLegal');
    document.getElementById('footPolitica').textContent = t('footPolitica');
    document.getElementById('footTerminos').textContent = t('footTerminos');
    document.getElementById('footReglamento').textContent = t('footReglamento');
    document.getElementById('footConducta').textContent = t('footConducta');

    document.getElementById('bizHoursLbl').textContent = t('bizHours');
    document.getElementById('bizHoursV').textContent = t('bizHoursV');
    document.getElementById('bizEmailLbl').textContent = t('bizEmail');
    document.querySelectorAll('.lang-toggle button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang')===LANG);
    });
    document.documentElement.lang = LANG;
  }

  document.querySelectorAll('.lang-toggle button').forEach(function(b){
    b.addEventListener('click', function(){ LANG = b.getAttribute('data-lang'); applyStatic(); route(); if(BOOKING.isOpen()) BOOKING.render(); CHATWIDGET.render(); });
  });

  // Menú móvil — en pantallas ≤860px .nav-links se oculta (ver CSS) y este botón hamburguesa
  // es la única forma de llegar a Visitas/Mi reserva/etc.; antes existía el botón en el HTML
  // pero sin CSS ni JS, así que en tablet/mobile esas opciones simplemente desaparecían.
  var navToggle = document.getElementById('navToggle');
  var mobileNav = document.getElementById('mobileNav');
  function closeMobileNav(){
    mobileNav.classList.remove('open');
    navToggle.setAttribute('aria-expanded', 'false');
  }
  navToggle.addEventListener('click', function(){
    var isOpen = mobileNav.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
  mobileNav.addEventListener('click', function(e){ if(e.target.closest('a')) closeMobileNav(); });
  window.addEventListener('hashchange', function(){ closeMobileNav(); route(); });

  applyStatic();
  route();
  CHATWIDGET.mount();
})();
</script>
