# Blueprint de Render.com para el bot de WhatsApp — nivel gratuito, sin tarjeta.
# Al conectar este repo en render.com (New > Blueprint), Render lee este archivo y prepara el
# servicio automáticamente; solo faltaría rellenar las variables marcadas sync:false (los
# secretos reales, que nunca deben vivir en este archivo versionado) en el dashboard de Render.
services:
  - type: web
    name: usoinmobiliario-whatsapp-bot
    runtime: node
    plan: free
    rootDir: whatsapp-assistant
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      # Activa los controles que solo deben aplicar en producción (hoy: exigir la firma del
      # webhook de WhatsApp en vez de solo advertir si falta — ver whatsapp.js/config/index.js
      # y SECURITY_AUDIT.md). IMPORTANTE: una vez desplegado esto, el webhook deja de aceptar
      # mensajes hasta que WHATSAPP_APP_SECRET (abajo) tenga un valor real configurado en el
      # dashboard de Render.
      - key: NODE_ENV
        value: production
      - key: FIREBASE_DATABASE_URL
        value: https://usoinmobiliario-c8e83-default-rtdb.firebaseio.com
      - key: SITE_BASE_URL
        value: https://superethicalgames.github.io/usoinmobiliario-webdemo
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: WHATSAPP_API_VERSION
        value: v20.0
      - key: GMAIL_USER
        value: usoinmobiliario@gmail.com
      - key: ADMIN_ORIGIN
        value: https://superethicalgames.github.io
      # Secretos reales — se rellenan a mano en el dashboard de Render, nunca aquí:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
